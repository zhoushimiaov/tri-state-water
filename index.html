<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#04141a">
<meta name="description" content="三态之水 Tri-State Water —— 单文件零依赖的 WebGL2 实时水场景，温度驱动冰 / 水 / 汽三态连续相变。">
<title>三态之水 · Tri-State Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=clash-display@500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  三态之水 (Tri-State Water)
  ------------------------------------------------------------
  视觉与技术路线复刻自开源项目 clearwater (github.com/Aureliengmz/clearwater, MIT)
  —— 浅水碧波 + 水底焦散 + 太阳眩光 + 交互涟漪 的实时 WebGL2 场景。
  本文件为从零手写的独立实现，并新增“温度三态”系统：
    凝固态(冰) / 液态(水) / 蒸发态(汽)，由温度滑杆连续驱动。
  无依赖 · 无构建 · 单文件。直接用浏览器打开即可。
-->
<style>
  :root{
    --ink:#0b0e12; --dim:rgba(11,14,18,.76); --dim2:rgba(11,14,18,.62); --faint:rgba(11,14,18,.48);
    --acc:#0e9488;
    --line:rgba(11,14,18,.18);
    --glass:rgba(255,255,255,.42);
    --focus:hsla(212,100%,38%,1);
    --font: 'Satoshi', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Clash Display', 'Satoshi', system-ui, 'PingFang SC', sans-serif;
    --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#dfeef2;
    font-family:var(--font);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }

  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:3px; border-radius:4px; }

  /* —— 顶栏：字标 + 幽灵按钮（墨色排版浮于画面之上，白色光晕保证可读） —— */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center;
    justify-content:space-between; padding:22px 32px; user-select:none; pointer-events:none; }
  #topbar > *{ pointer-events:auto; }
  .brand{ display:flex; align-items:baseline; gap:18px; }
  .brand b{ font:500 24px/1 var(--mono); letter-spacing:.26em; color:var(--ink); text-shadow:0 1px 14px rgba(255,255,255,.8); }
  .brand span{ font:400 22px/1 var(--font); letter-spacing:.38em; color:var(--dim); text-shadow:0 1px 12px rgba(255,255,255,.75); }
  .top-right{ display:flex; align-items:center; gap:12px; }
  .pill{ font:500 20px/1 var(--mono); letter-spacing:.05em; color:var(--dim);
    background:var(--glass); border-radius:999px; padding:12px 20px;
    box-shadow:var(--line) 0 0 0 1px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ghost{ appearance:none; border:0; cursor:pointer;
    font:500 20px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
    background:rgba(255,255,255,.30); border-radius:999px; padding:13px 24px;
    box-shadow:var(--line) 0 0 0 1px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:color .2s, box-shadow .2s, background .2s; white-space:nowrap; }
  .ghost:hover{ color:var(--ink); box-shadow:rgba(11,14,18,.42) 0 0 0 1px; }
  .ghost.on{ color:var(--ink); box-shadow:var(--acc) 0 0 0 1.5px; }

  /* —— 左下 hero：超大温度读数（Clash Display） —— */
  #hero{ position:fixed; left:40px; bottom:38px; z-index:10; user-select:none; }
  /* 底部浅色衬底：墨字压在亮雾上，暗场景（深水）下依然清晰 */
  #hero::before{ content:''; position:absolute; z-index:-1; left:-88px; bottom:-64px;
    width:1040px; height:700px; pointer-events:none;
    background:radial-gradient(ellipse 100% 100% at 16% 84%,
      rgba(250,252,255,.62) 0%, rgba(250,252,255,.34) 46%, transparent 72%); }
  #heroPhase{ display:flex; align-items:center; gap:14px; margin-bottom:16px;
    font:500 21px/1 var(--mono); letter-spacing:.26em; text-transform:uppercase; color:var(--dim);
    text-shadow:0 1px 12px rgba(255,255,255,.85); }
  #heroPhase::before{ content:''; width:9px; height:9px; border-radius:50%; flex:none;
    background:var(--state,var(--acc)); box-shadow:0 0 12px var(--state,var(--acc));
    transition:background .4s ease, box-shadow .4s ease; }
  #tempRead{ display:flex; align-items:flex-start; color:var(--ink);
    text-shadow:0 2px 36px rgba(255,255,255,.65); }
  #tempRead b{ font:500 clamp(166px, 23vw, 275px)/0.86 var(--disp); letter-spacing:-.02em; }
  #tempRead .unit{ font:500 clamp(38px, 4.8vw, 58px)/1 var(--disp); color:var(--dim);
    margin:.28em 0 0 12px; }

  /* 状态切换：幽灵文本按钮 + 激活下划线 */
  #states{ display:flex; gap:44px; margin-top:28px; }
  .preset{ appearance:none; border:0; background:none; cursor:pointer; padding:6px 0 11px;
    font:500 24px/1 var(--font); letter-spacing:.14em; color:var(--faint);
    border-bottom:3px solid transparent; text-shadow:0 1px 10px rgba(255,255,255,.8);
    transition:color .2s, border-color .3s; }
  .preset:hover{ color:var(--ink); }
  .preset.on{ color:var(--ink); border-bottom-color:var(--acc); }

  /* 宽温滑杆 */
  #sliderWrap{ width:min(680px, 66vw); margin-top:26px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:26px;
    background:transparent; cursor:pointer; }
  input[type=range]:focus-visible{ outline-offset:3px; }
  input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:3px; background:rgba(11,14,18,.16); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    margin-top:-6.5px; background:var(--ink); box-shadow:0 0 0 2px rgba(255,255,255,.75); transition:transform .15s ease; }
  input[type=range]:hover::-webkit-slider-thumb{ transform:scale(1.25); }
  input[type=range]:active::-webkit-slider-thumb{ transform:scale(1.4); }
  input[type=range]::-moz-range-track{ height:5px; border-radius:3px; background:rgba(11,14,18,.16); }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border:0; border-radius:50%;
    background:var(--ink); box-shadow:0 0 0 2px rgba(255,255,255,.75); }
  /* 温度滑杆：渐变轨道，停靠点对齐真实刻度（0°C=19.35%，100°C=73.1%） */
  #slider::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,#9fcfe8 0%,#a8dde8 19.35%,#57c9b8 19.35%,#57c9b8 73.1%,#e0a06a 90%,#d8845a 100%); }
  #slider::-moz-range-track{
    background:linear-gradient(90deg,#9fcfe8 0%,#a8dde8 19.35%,#57c9b8 19.35%,#57c9b8 73.1%,#e0a06a 90%,#d8845a 100%); }
  #ticks{ position:relative; height:22px; margin-top:5px; color:var(--faint); font-size:17px; font-weight:500;
    letter-spacing:.05em; font-family:var(--mono); font-variant-numeric:tabular-nums;
    text-shadow:0 1px 9px rgba(255,255,255,.85); }
  #ticks span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
  #ticks span::before{ content:''; position:absolute; left:50%; top:-8px; width:2px; height:4px; background:var(--faint); }
  #ticks span:first-child{ left:0; transform:none; }
  #ticks span:first-child::before{ left:2px; }
  #ticks span:last-child{ right:0; transform:none; }
  #ticks span:last-child::before{ left:auto; right:2px; }

  /* 参数抽屉（默认隐藏，顶栏「参数」唤起） */
  #params{ position:fixed; top:88px; right:26px; z-index:10; width:384px;
    background:var(--glass); border-radius:16px;
    box-shadow:var(--line) 0 0 0 1px, rgba(11,14,18,.25) 0 28px 56px -16px;
    backdrop-filter:blur(26px) saturate(1.1); -webkit-backdrop-filter:blur(26px) saturate(1.1);
    padding:20px 22px 18px; user-select:none;
    opacity:0; transform:translateX(14px); pointer-events:none;
    transition:opacity .3s ease, transform .3s cubic-bezier(.5,0,.25,1); }
  #params.open{ opacity:1; transform:none; pointer-events:auto; }
  #params h2{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;
    font:500 20px/1 var(--font); letter-spacing:.18em; color:var(--faint); text-transform:uppercase; }
  #params h2 span{ font:500 16px/1 var(--mono); letter-spacing:.12em; }
  .row{ display:grid; grid-template-columns:58px 1fr 58px; align-items:center; gap:12px;
    padding:9px 0; font:400 20px/1 var(--font); letter-spacing:.08em; color:var(--dim2); }
  .row b{ font:500 18px/1 var(--mono); color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; }
  .row select{ appearance:none; grid-column:2/4; background:rgba(255,255,255,.5); color:var(--dim);
    border:0; border-radius:10px; padding:11px 14px; font:500 19px var(--mono); cursor:pointer;
    box-shadow:rgba(11,14,18,.14) 0 0 0 1px inset; }
  .row select:hover{ color:var(--ink); }

  /* 右下提示 */
  #hint{ position:fixed; right:30px; bottom:28px; z-index:10; text-align:right;
    font:400 19px/2 var(--mono); letter-spacing:.1em; color:var(--faint);
    text-transform:uppercase; user-select:none; pointer-events:none;
    text-shadow:0 1px 9px rgba(255,255,255,.85); }
  #hint kbd{ font:500 16px var(--mono); color:var(--dim); box-shadow:0 0 0 1px var(--line) inset;
    border-radius:5px; padding:3px 8px; }

  /* 隐藏态下的恢复按钮（常驻右下角，点击或按 H 恢复） */
  #showBtn{ position:fixed; right:20px; bottom:20px; z-index:12; display:none; }
  #showBtn.on{ display:block; }

  #fatal{ position:fixed; inset:0; z-index:99; display:none; place-items:center; background:#eef4f6;
    color:var(--dim); font-size:20px; text-align:center; line-height:2; }
  .hidden{ display:none !important; }

  /* —— 入场 —— */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  #topbar{ animation:fadeDown .7s cubic-bezier(.18,.72,.22,1) .15s backwards; }
  #hero{ animation:fadeUp .9s cubic-bezier(.18,.72,.22,1) .35s backwards; }
  #hint{ animation:fadeUp .8s cubic-bezier(.18,.72,.22,1) .55s backwards; }

  /* —— H 键显隐过渡 —— */
  #topbar, #hero, #hint{ transition:opacity .4s ease, transform .4s cubic-bezier(.5,0,.25,1); }
  .ui-off{ opacity:0 !important; pointer-events:none !important; }
  #topbar.ui-off{ transform:translateY(-12px); }
  #hero.ui-off{ transform:translateY(16px); }
  #hint.ui-off{ transform:translateY(10px); }

  /* —— 相态切换弹跳（大读数从左下缘弹起） —— */
  @keyframes pop { 0% { transform:scale(.96); } 55% { transform:scale(1.03); } 100% { transform:scale(1); } }
  #tempRead.pop b{ display:inline-block; transform-origin:left bottom; animation:pop .45s cubic-bezier(.34,1.56,.64,1); }

  /* —— 窄屏 —— */
  @media (max-width:720px){
    #topbar{ padding:14px 16px; flex-direction:column; align-items:flex-start; row-gap:10px; }
    .top-right{ width:100%; justify-content:space-between; }
    .brand b{ font-size:15px; letter-spacing:.2em; }
    .brand span, #fps{ display:none; }
    .ghost{ font-size:15px; padding:10px 16px; letter-spacing:.12em; }
    #hero{ left:20px; bottom:22px; }
    #heroPhase{ font-size:15px; }
    #states{ gap:24px; margin-top:20px; }
    .preset{ font-size:17px; }
    #sliderWrap{ width:calc(100vw - 40px); margin-top:18px; }
    #ticks{ font-size:12px; height:16px; }
    #hint{ display:none; }
    #params{ top:auto; bottom:16px; left:14px; right:14px; width:auto; }
  }
  /* —— 尊重系统的减弱动效偏好 —— */
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }</style>
</head>
<body>
<canvas id="gl"></canvas>

<header id="topbar">
  <div class="brand"><b>TRI-STATE WATER</b><span>三态之水</span></div>
  <div class="top-right">
    <span class="pill" id="fps">-- fps</span>
    <button class="ghost" id="paramsBtn" title="渲染参数">参数 Params</button>
    <button class="ghost" id="hideBtn" title="隐藏界面（快捷键 H）">隐藏 Hide</button>
  </div>
</header>

<div id="hero">
  <div id="heroPhase">Liquid · 液态 · 水</div>
  <div id="tempRead" role="status" aria-live="polite"><b>24</b><span class="unit">°C</span></div>
  <div id="states" role="group" aria-label="相态预设">
    <button class="preset" data-t="-36" aria-pressed="false" title="凝固态（快捷键 1）">冰 · Ice</button>
    <button class="preset on" data-t="24" aria-pressed="true" title="液态（快捷键 2）">水 · Water</button>
    <button class="preset" data-t="130" aria-pressed="false" title="蒸发态（快捷键 3）">汽 · Steam</button>
  </div>
  <div id="sliderWrap">
    <input id="slider" type="range" min="-36" max="150" step="1" value="24" aria-label="水温，范围 -36 到 150 摄氏度">
    <div id="ticks" aria-hidden="true"><span>-36°</span><span style="left:19.35%">0° 冰点</span><span style="left:73.1%">100° 沸点</span><span>150°</span></div>
  </div>
</div>

<aside id="params" aria-label="渲染参数">
  <h2>参数<span>Params</span></h2>
  <label class="row">波幅<input id="waveCtl" type="range" min="0" max="200" step="5" value="100" aria-label="波幅百分比"><b id="waveVal">100%</b></label>
  <label class="row">缩放<input id="zoomCtl" type="range" min="0" max="100" step="1" value="0" aria-label="缩放"><b id="zoomVal">0%</b></label>
  <label class="row">画质<select id="qualityCtl" aria-label="画质">
    <option value="0" selected>自动</option>
    <option value="1">高</option>
    <option value="0.7">中</option>
    <option value="0.45">低</option>
  </select></label>
</aside>

<div id="hint">拖动 环视 · 点击 涟漪 · 滚轮 缩放<br><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 状态 · <kbd>H</kbd> 隐藏界面</div>
<button class="ghost" id="showBtn">显示 UI · H</button>
<div id="fatal"><div>此演示需要支持 <b>WebGL2</b> 的浏览器。<br>请使用较新的 Chrome / Edge / Firefox / Safari 打开。</div></div>

<script>
'use strict';
window.__frames = 0;
window.addEventListener('error', e => { window.__lastError = String(e.message || e); });
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const ssj = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: true });
if (!gl) { $('#fatal').style.display = 'grid'; throw new Error('no webgl2'); }
const extHDR = gl.getExtension('EXT_color_buffer_float');

// WebGL 上下文丢失保护：提示并在恢复后自动重载
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  const f = $('#fatal');
  f.firstElementChild.innerHTML = '图形上下文意外丢失。<br>正在尝试恢复……若长时间无响应，请刷新页面。';
  f.style.display = 'grid';
});
canvas.addEventListener('webglcontextrestored', () => location.reload());

// —— UI 元素引用（提前到 URL 预置之前） ——
const slider = $('#slider');
const hero = $('#hero');
const tempRead = $('#tempRead'), tempNum = tempRead.querySelector('b');
const phaseEl = $('#heroPhase');
const zoomCtl = $('#zoomCtl'), zoomVal = $('#zoomVal');
const presetBtns = [...document.querySelectorAll('.preset')];
function markPresets(near) {
  presetBtns.forEach(b => {
    const on = +b.dataset.t === near;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');

/* ================= 迷你矩阵库 ================= */
function m4Persp(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0,  0, f, 0, 0,  0, 0, (far + near) * nf, -1,  0, 0, 2 * far * near * nf, 0]);
}
function m4Mul(a, b) { // column-major a*b
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  return o;
}
function camBasis(yaw, pitch) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const f = [sy * cp, sp, -cy * cp];
  const r = [cy, 0, sy];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  return { f, r, u };
}
function rollBasis(B, roll) {
  const c = Math.cos(roll), s = Math.sin(roll);
  return { f: B.f,
    r: [B.r[0] * c + B.u[0] * s, B.r[1] * c + B.u[1] * s, B.r[2] * c + B.u[2] * s],
    u: [B.u[0] * c - B.r[0] * s, B.u[1] * c - B.r[1] * s, B.u[2] * c - B.r[2] * s] };
}
function m4View(eye, B) {
  const { f, r, u } = B;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  return new Float32Array([
    r[0], u[0], -f[0], 0,  r[1], u[1], -f[1], 0,  r[2], u[2], -f[2], 0,
    -dot(r, eye), -dot(u, eye), dot(f, eye), 1]);
}
const v3norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

/* ================= GLSL 公共块 ================= */
const NOISE = `
float hash1(vec2 p){ p = fract(p*vec2(127.1,311.7)); p += dot(p,p+34.5); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ float n = hash1(p); return vec2(n, hash1(p+n+17.13)); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = hash1(i), b = hash1(i+vec2(1,0)), c = hash1(i+vec2(0,1)), d = hash1(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + vec2(19.7,7.3); a *= 0.5; }
  return s;
}
// —— 精度稳健版噪声（山体专用）：小常数哈希，避免大坐标下 fract 精度塌缩成方块 ——
float hashM(vec2 p){
  vec3 q = fract(vec3(p.xyx)*0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y)*q.z);
}
float vnoiseM(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = hashM(i), b = hashM(i+vec2(1,0)), c = hashM(i+vec2(0,1)), d = hashM(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbmM(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i=0;i<4;i++){ s += a*vnoiseM(p); p = p*2.03 + vec2(19.7,7.3); a *= 0.5; }
  return s;
}
vec3 worley(vec2 p){
  vec2 n = floor(p), f = fract(p);
  float F1 = 8.0, F2 = 8.0, id = 0.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j));
    vec2 o = hash2(n+g);
    float d = length(g+o-f);
    if(d < F1){ F2 = F1; F1 = d; id = hash1(n+g+31.7); }
    else if(d < F2){ F2 = d; }
  }
  return vec3(F1, F2, id);
}
float web(vec2 p){ vec3 w = worley(p); return 1.0 - smoothstep(0.02, 0.16, w.y - w.x); }
vec3 skyColor(vec3 rd, vec3 sun){
  float y = max(rd.y, 0.0);
  vec3 zen  = vec3(0.16, 0.42, 0.78);          // 天顶：饱和蓝，不再灰蒙
  vec3 hor  = vec3(0.70, 0.84, 0.95);          // 地平线：清亮的浅蓝白（衬出雪山剪影）
  vec3 c = mix(hor, zen, pow(y, 0.62));
  // 近地平线的暖色微光（阳光散射）
  c = mix(c, vec3(0.98, 0.94, 0.86), (1.0 - smoothstep(0.0, 0.35, y))*0.28);
  float sd = max(dot(rd,sun), 0.0);
  c += vec3(1.0,0.83,0.58)*pow(sd,8.0)*0.30;
  c += vec3(1.0,0.90,0.72)*pow(sd,320.0)*5.0;
  return c;
}
// 山脊噪声：ridged fbm（1-|2n-1| 的平方），产生尖锐山脊线而非圆丘；
// 采样在方位角的单位圆上进行，环视 360° 无接缝
float ridgeAz(float az, float freq, float seed){
  vec2 p = vec2(cos(az), sin(az))*freq + seed*7.31;
  float s = 0.0, a = 0.55;
  for(int i=0;i<5;i++){
    float n = vnoiseM(p);
    n = 1.0 - abs(2.0*n - 1.0);
    s += a*n*n;
    p = p*2.13 + vec2(11.3, 5.7);
    a *= 0.52;
  }
  return s;
}
// 山体剖面：ridged fbm 山脊 + 大尺度起伏分组
float mtnProfile(float az, float seed, float hBase, float hVar){
  float h = hBase + hVar*ridgeAz(az, 3.4 + seed*0.17, seed);
  h += (hBase + hVar)*0.10*sin(az*2.0 + seed*3.7);
  return h;
}
// 单层山体：坡度光照 + 谷脊遮蔽 + 顺坡结构 + 雪线斑块 + 大气透视
vec3 ridgeLayer(float az, float y, float seed, float hBase, float hVar,
                float haze, float snowLine, vec3 sky, vec3 sun, vec3 col){
  float h = mtnProfile(az, seed, hBase, hVar);
  if(y >= h) return col;
  // —— 剖面采样：坡度定受光面，谷暗脊亮（同一对偏移样本兼算曲率） ——
  float eps = 0.03;
  float hL = mtnProfile(az - eps, seed, hBase, hVar);
  float hR = mtnProfile(az + eps, seed, hBase, hVar);
  float aspect = clamp((hR - hL)*170.0, -1.0, 1.0);
  float cav = clamp(((hL + hR)*0.5 - h)*250.0, -1.0, 1.0);     // >0 谷地，<0 脊凸
  float dAz = atan(sun.z, sun.x) - az;
  float rel = clamp(y/max(h, 1e-3), 0.0, 1.0);          // 山体内相对海拔：山脚 0 → 脊线 1
  // —— 顺坡结构：两个频率的坡面纹理（岩层、冲沟、雪檐），随海拔下行 ——
  float spur = fbmM(vec2(cos(az), sin(az))*8.0 + vec2(0.0, rel*7.0) + seed*3.1);
  float spur2 = fbmM(vec2(cos(az), sin(az))*17.0 + vec2(rel*13.0, seed*5.7));
  // 坡度受光叠加坡面纹理，且向山脚渐平（山体下部起伏趋缓），避免竖直帘状条纹
  float slopeFade = smoothstep(0.04, 0.45, rel);
  float asp2 = clamp(aspect*0.6 + (spur - 0.5)*1.6, -1.0, 1.0)*slopeFade;
  float sunFace = -asp2*sin(dAz);
  float diff = clamp(0.50 + 0.80*sunFace - 0.32*max(cos(dAz), 0.0), 0.0, 1.0);
  // —— 岩壁 ——
  vec3 rock = mix(vec3(0.24, 0.29, 0.385), vec3(0.10, 0.13, 0.205), rel*rel*1.3);
  rock *= 0.84 + 0.32*spur;
  rock *= 0.88 + 0.24*spur2;
  // —— 雪：雪线 + 横向雪带斑块 + 缓坡积雪 ——
  float snowPatch = (fbmM(vec2(cos(az), sin(az))*6.0 + vec2(rel*13.0, seed*2.9)) - 0.5)*0.34;
  float gentle = (1.0 - abs(aspect)*0.5)*(0.70 + 0.60*spur);   // 积雪随坡向且随坡面纹理断续
  float snowM = smoothstep(snowLine, snowLine + 0.15, rel + snowPatch + 0.10*gentle*rel);
  snowM *= smoothstep(0.02, 0.14, rel);                  // 山脚无雪
  // —— 光照合成：谷地落影、脊凸提亮；雪在阴面吃天空光仍亮但不过曝 ——
  float amb = 0.30 + 0.24*haze;
  float shade = amb + 1.10*diff;
  shade *= 1.0 - 0.22*max(cav, 0.0)*(1.0 - haze)*slopeFade; // 谷地落影（限于坡面）
  shade *= 1.0 + 0.15*max(-cav, 0.0)*slopeFade;             // 脊凸提亮
  vec3 rockLit = rock*shade + vec3(1.0, 0.74, 0.46)*max(sunFace, 0.0)*0.07*max(sun.y, 0.0);
  vec3 snowCol = mix(vec3(0.55, 0.66, 0.85), vec3(1.06, 1.03, 0.99), diff);
  vec3 snowLit = snowCol*(amb*0.9 + 0.30 + 0.65*diff)*(0.92 + 0.16*spur)
               + vec3(1.0, 0.80, 0.52)*pow(diff, 3.0)*0.16;
  vec3 mtn = mix(rockLit, snowLit, snowM);
  // —— 大气透视：溶向略深的雾色而非亮白天际，保住剪影对比；山脚雾放缓、保留坡面结构 ——
  vec3 hazeCol = mix(sky, vec3(0.60, 0.70, 0.85), 0.45);
  float hz2 = clamp(haze + (1.0 - rel)*0.10*haze, 0.0, 0.92);
  mtn = mix(hazeCol, mtn, 1.0 - hz2);
  float edge = smoothstep(h, h - 0.004 - haze*0.005, y);
  return mix(col, mtn, edge);
}
// 远山：最远为高大的雪山主脉（浓雾），中近景岩雪相间层层推进
vec3 mountains(vec3 rd, vec3 sky, vec3 sun){
  float y = rd.y;
  if(y > 0.15) return sky;
  float az = atan(rd.z, rd.x);
  vec3 col = sky;
  col = ridgeLayer(az, y, 3.1, 0.042, 0.062, 0.55, 0.38, sky, sun, col);   // 远景雪山主脉
  col = ridgeLayer(az, y, 7.7, 0.032, 0.052, 0.36, 0.48, sky, sun, col);   // 中景岩雪相间
  col = ridgeLayer(az, y, 12.9, 0.024, 0.058, 0.16, 0.58, sky, sun, col);  // 近景深色岩脊
  // 山脚与水线衔接的雾化
  float hz = 1.0 - smoothstep(0.0, 0.022, y);
  col = mix(col, vec3(0.80, 0.89, 0.96), hz*0.30);
  return col;
}`;

const waveDef = [];
{
  let seed = 7, rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 22; i++) {
    const t = i / 21;
    const len = 7.0 * Math.pow(0.82, i * 22 / 21) * (0.85 + rand() * 0.3);   // 波长 7m → ~0.3m
    const ang = rand() * Math.PI * 2;
    const k = 2 * Math.PI / len;
    const amp = len * 0.014 * (0.7 + rand() * 0.6);
    const w = Math.sqrt(9.8 * k) * (0.92 + rand() * 0.16);                    // 深水色散关系
    waveDef.push({ dx: Math.cos(ang), dz: Math.sin(ang), k, amp, w, ph: rand() * 6.28 });
  }
}
const WAVE_CODE = waveDef.map(v =>
  `{ float phz = dot(vec2(${v.dx.toFixed(5)},${v.dz.toFixed(5)}), p)*${v.k.toFixed(5)} + uTime*${v.w.toFixed(5)} + ${v.ph.toFixed(5)};
     h += ${v.amp.toFixed(6)}*sin(phz);
     grad += vec2(${v.dx.toFixed(5)},${v.dz.toFixed(5)})*(${(v.amp * v.k).toFixed(6)}*cos(phz)); }`).join('\n');

uniform mat4 uVP;

uniform vec4 uRipple[24];
layout(location = 0) in vec3 aPos;
out vec3 vW; out vec3 vN; out float vH;
void main(){
  vec2 p = aPos.xz;

  ${WAVE_CODE}
  h += uSteam*0.016*sin(p.x*6.7+uTime*8.5)*sin(p.y*7.9-uTime*7.3);
  grad += uSteam*0.016*vec2(6.7*cos(p.x*6.7+uTime*8.5)*sin(p.y*7.9-uTime*7.3),
                            -7.9*sin(p.x*6.7+uTime*8.5)*cos(p.y*7.9-uTime*7.3));
  for(int i=0;i<24;i++){
    vec4 r = uRipple[i];
    float age = uTime - r.z;
    if(r.w > 0.0 && age > 0.0 && age < 5.0){
      vec2 dv = p - r.xy;
      float d = max(length(dv), 1e-4);

      h += env*cos(front*8.0);
      float dhdd = env*(-7.0*front-1.3)*cos(front*8.0) - env*sin(front*8.0)*8.0;
      grad += (dhdd/d)*dv;
    }

  h *= uWaveAmp; grad *= uWaveAmp;
  vec3 wp = vec3(p.x, h, p.y);
  vW = wp; vN = vec3(-grad.x, 1.0, -grad.y); vH = h;
  gl_Position = uVP*vec4(wp, 1.0);
}`;

  if(uSunVis > 0.001){
    vec2 dir = uSunUV - uv;
    vec3 acc = vec3(0.0);
    for(int i=0;i<24;i++){
      float t = float(i)/23.0;
      acc += max(texture(uTex, uv + dir*t*0.6).rgb - thr, 0.0)*(1.0-t);
    }
    col += acc/24.0*1.6*uSunVis;
    vec3 s2 = vec3(0.0);
    for(int i=-10;i<=10;i++){
      s2 += max(texture(uTex, uv + (uSunUV-uv)*0.02 + vec2(float(i)*0.012, 0.0)).rgb - thr, 0.0);
    }
    col += s2/21.0*0.5*uSunVis;
  }

  col *= 1.05;
  col = clamp((col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14), 0.0, 1.0);
  col = pow(col, vec3(1.0/2.2));
  vec2 q = vUv - 0.5;
  float vig = 1.0 - (0.45 - 0.05*uIdle)*dot(q,q);
  col *= vig;
  float grain = (hash1(gl_FragCoord.xy + uTime) - 0.5)*(0.012 + 0.008*uIdle);
  col += grain;
  outColor = vec4(col, 1.0);
}`;

/* ================= 编译辅助 ================= */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, '#version 300 es\n' + vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, '#version 300 es\n' + fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  p._u = {};
  return p;
}
function U(p, n) { return p._u[n] !== undefined ? p._u[n] : (p._u[n] = gl.getUniformLocation(p, n)); }

const progWater = program(VS_WATER, FS_WATER);
const progSeabed = program(VS_SEABED, FS_SEABED);
const progSky = program(VS_SKY, FS_SKY);
const progSteam = program(VS_STEAM, FS_STEAM);
const progSnow = program(VS_SNOW, FS_SNOW);
const progPost = program(VS_POST, FS_POST);

/* ================= 几何体 ================= */
function vao(bindFn, attrs) {
  const v = gl.createVertexArray();
  gl.bindVertexArray(v);
  bindFn();
  gl.bindVertexArray(null);
  return v;
}
function attrib(loc, data, size, stride = 0, offset = 0) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
}
// 水面网格
const waterVAO = (() => {
  const N = 300, half = 20;
  const verts = [], idx = [];
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++)
    verts.push(-half + 40 * i / N, 0, -half + 40 * j / N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const ib = gl.createBuffer();
  const v = vao(() => {
    attrib(0, new Float32Array(verts), 3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
  });
  v.count = idx.length;
  return v;
})();
// 海床
const seabedVAO = (() => {
  const ib = gl.createBuffer();
  const v = vao(() => {
    attrib(0, new Float32Array([-60, -2.35, -60, 60, -2.35, -60, -60, -2.35, 60, 60, -2.35, 60]), 3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 2, 1, 3]), gl.STATIC_DRAW);
  });
  v.count = 6;
  return v;
})();
// 全屏大三角
const triVAO = vao(() => attrib(0, new Float32Array([-1, -1, 3, -1, -1, 3]), 2));
// 蒸汽羽流 24 块
const steamVAO = (() => {
  const corners = [-1, -1, 1, -1, -1, 1, 1, 1], verts = [], idx = [];
  for (let q = 0; q < 24; q++) {
    for (let c = 0; c < 4; c++) verts.push(corners[c * 2], corners[c * 2 + 1], q * 7.13 + 1.7);
    const b = q * 4; idx.push(b, b + 1, b + 2, b + 2, b + 1, b + 3);
  }
  const ib = gl.createBuffer();
  const v = vao(() => {
    attrib(0, new Float32Array(verts), 2, 12, 0);
    attrib(1, new Float32Array(verts), 1, 12, 8);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  });
  v.count = idx.length;
  return v;
})();
// 雪 160 点
const snowVAO = (() => {
  const seeds = new Float32Array(160 * 4);
  for (let i = 0; i < 160; i++) {
    seeds[i * 4] = Math.random() * 14 - 7;
    seeds[i * 4 + 1] = Math.random() * 4.6;
    seeds[i * 4 + 2] = Math.random() * 12 - 9;
    seeds[i * 4 + 3] = Math.random() * 100;
  }
  return vao(() => attrib(0, seeds, 4));
})();

/* ================= 场景 FBO ================= */
let sceneFBO = null, fboW = 0, fboH = 0;
const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
let resAdj = 1.0;
function makeFBO(w, h) {
  if (sceneFBO) { gl.deleteTexture(sceneFBO.tex); gl.deleteFramebuffer(sceneFBO.fb); }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (extHDR) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  sceneFBO = { tex, fb };
  fboW = w; fboH = h;
}
function resize() {
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const fw = Math.max(2, Math.floor(w * resAdj)), fh = Math.max(2, Math.floor(h * resAdj));
  if (fw !== fboW || fh !== fboH) makeFBO(fw, fh);
}
window.addEventListener('resize', resize);

/* ================= 场景状态 ================= */
const SUN = v3norm([-0.32, 0.42, -0.85]);
const CAM_POS = [0, 1.65, 7.2];
const FOV = 55 * Math.PI / 180;
let yaw = 0, pitch = -0.52;
// URL 可指定初始机位：?yaw=0.8&pitch=-0.2（便于分享视角与调试截图）
if (params.has('yaw'))   yaw   = clamp(parseFloat(params.get('yaw'))   || 0,    -1.25, 1.25);
if (params.has('pitch')) pitch = clamp(parseFloat(params.get('pitch')) || -0.52, -1.15, -0.15);
let yawV = 0, pitchV = 0;               // 相机角速度（惯性）
let zoom = 0, zoomV = 0;                // 滚轮缩放（0 近 → 1 远）
let camPos = CAM_POS.slice();           // 动态相机位置（含 idle 呼吸）
let simTime = 0;
let targetTemp = 24, dispTemp = 24;
let tempVel = 0;                        // 温度变化率 °C/s（驱动色差脉冲）
// —— 相变冲击 / 打击感特效状态 ——
let flash = 0, aberr = 0, shake = 0, shakeAng = 0, shakeFreq = 0;
let icePrev = 0, steamPrev = 0;         // 相变跨越检测
let idleAmt = 0;                        // 静止呼吸权重
let idleClock = 0;                      // 仅静止时前进的相位钟
let lastActive = 0;                     // 上次交互的 simTime

// URL 预置：?state=ice|water|steam  ?ui=0  ?debug
{
  const s = params.get('state');
  if (s === 'ice') targetTemp = dispTemp = -36;
  else if (s === 'steam') targetTemp = dispTemp = 130;
  else if (s === 'water') targetTemp = dispTemp = 24;
  if (s) {
    slider.value = targetTemp;
    markPresets(targetTemp);
  }
  if (params.get('ui') === '0') ['topbar', 'hero', 'hint', 'params'].forEach(id => $('#' + id).classList.add('hidden'));
}

// 涟漪槽
const NR = 24;
const ripples = new Float32Array(NR * 4).fill(0);
for (let i = 0; i < NR; i++) ripples[i * 4 + 2] = -100;
let rippleHead = 0;
function addRipple(x, z, k) {
  const i = rippleHead; rippleHead = (rippleHead + 1) % NR;
  ripples[i * 4] = x; ripples[i * 4 + 1] = z;
  ripples[i * 4 + 2] = simTime; ripples[i * 4 + 3] = k || (0.32 + Math.random() * 0.1);
}

// 每帧导出的状态参数
let P = {};
function updateStateParams() {
  const t = dispTemp;
  const ice = ssj(1.5, -4, t);
  const deepIce = ssj(-10, -34, t);
  const steam = ssj(72, 108, t) * (1 - ice);
  const warm = ssj(35, 95, t) * (1 - steam);
  const snow = ssj(-3, -13, t);
  const mix3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  let deep = mix3([0.010, 0.085, 0.110], [0.025, 0.150, 0.160], clamp(warm * 0.8 + steam * 0.4, 0, 1));
  deep = mix3(deep, [0.040, 0.190, 0.220], ice);
  let waterCol = mix3([0.040, 0.300, 0.330], [0.070, 0.360, 0.330], warm);
  P = { ice, deepIce, steam, warm, snow, waveAmp: Math.max(0, 1 - 0.96 * ice - 0.025 * deepIce), deep, waterCol };
}

/* ================= 输入 ================= */
let dragging = false, moved = 0, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  yawV = 0; pitchV = 0;                 // 按住即接管，清掉惯性
  lastActive = simTime;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6) {
    lastActive = simTime;
    yaw = clamp(yaw - dx * 0.0032, -1.25, 1.25);
    pitch = clamp(pitch - dy * 0.0032, -1.15, -0.15);
    // 记录瞬时角速度（指数平滑），松手后作为惯性初速度
    const k = 0.55;
    yawV = yawV * (1 - k) + (-dx * 0.0032 * 60) * k;
    pitchV = pitchV * (1 - k) + (-dy * 0.0032 * 60) * k;
  }
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  if (moved <= 6 && P.ice < 0.6) {
    lastActive = simTime;
    const B = camBasis(yaw, pitch);
    const ndcX = (e.clientX / canvas.clientWidth) * 2 - 1;
    const ndcY = 1 - (e.clientY / canvas.clientHeight) * 2;
    const tf = Math.tan(FOV / 2), asp = canvas.clientWidth / canvas.clientHeight;
    const dir = v3norm([
      B.f[0] + B.r[0] * ndcX * tf * asp + B.u[0] * ndcY * tf,
      B.f[1] + B.r[1] * ndcX * tf * asp + B.u[1] * ndcY * tf,
      B.f[2] + B.r[2] * ndcX * tf * asp + B.u[2] * ndcY * tf]);
    if (dir[1] < -0.02) {
      const t = -camPos[1] / dir[1];
      const px = camPos[0] + dir[0] * t, pz = camPos[2] + dir[2] * t;
      if (Math.abs(px) < 13 && Math.abs(pz) < 13) {
        addRipple(px, pz, 0.5 + Math.random() * 0.12);   // 加强涟漪
        // —— 打击感：轻微色差 + 震动 ——
        aberr = Math.max(aberr, 0.010);
        shake = Math.max(shake, 0.0035);
        shakeAng = Math.random() * Math.PI * 2; shakeFreq = 26;
      }
    }
  }
});
canvas.addEventListener('pointercancel', () => dragging = false);
// 滚轮缩放（0 近 → 1 远）
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  lastActive = simTime;
  zoomV += (e.deltaY > 0 ? 1 : -1) * 0.38 * Math.min(Math.abs(e.deltaY), 120) / 60;
  zoomV = clamp(zoomV, -1.4, 1.4);
}, { passive: false });

slider.addEventListener('input', () => setTemp(+slider.value, false));
presetBtns.forEach(b => b.addEventListener('click', () => setTemp(+b.dataset.t, true)));
function setTemp(t, fromPreset) {
  targetTemp = t;
  lastActive = simTime;
  // 地址栏同步：预设写入 ?state=，滑杆自由值则移除该参数（可分享当前状态）
  const st = { '-36': 'ice', '24': 'water', '130': 'steam' }[String(t)];
  const url = new URL(location.href);
  if (st) url.searchParams.set('state', st); else url.searchParams.delete('state');
  history.replaceState(null, '', url);
  if (fromPreset) {
    slider.value = t;
    markPresets(t);
    presetBtns.forEach(b => { if (+b.dataset.t === t) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } });
  } else {
    markPresets(NaN);   // 自由温度：不高亮任何预设（updateUI 会按最近预设回标）
  }
}
// —— 显隐：H / 隐藏按钮；隐藏时右下角常驻「显示 UI」幽灵按钮保证可恢复 ——
let uiHidden = false;
function toggleUI() {

  if (uiHidden) { $('#params').classList.remove('open'); $('#paramsBtn').classList.remove('on'); }

$('#hideBtn').addEventListener('click', toggleUI);
$('#showBtn').addEventListener('click', toggleUI);
$('#paramsBtn').addEventListener('click', () => {

window.addEventListener('keydown', e => {

  if (e.key === '2') setTemp(24, true);

});

// —— 参数控件：波幅 / 缩放 / 画质 ——
let waveMul = 1, qLock = 0;   // qLock > 0 时锁定渲染分辨率比例，覆盖自适应画质
$('#waveCtl').addEventListener('input', e => {
  waveMul = +e.target.value / 100;

});
zoomCtl.addEventListener('input', e => {

let lastBadge = '', lastPhase = '', lastNear = null;
function updateUI() {
  const t = dispTemp, p = P;
  let name, en, color;
  if (p.ice > 0.85) { name = '凝固态 · 冰'; en = 'Solid'; color = '#2f8fc4'; }
  else if (p.ice > 0.05) { name = '正在结冰…'; en = 'Freezing'; color = '#5ba4cf'; }
  else if (p.steam > 0.85) { name = '蒸发态 · 汽'; en = 'Vapor'; color = '#c96a2e'; }
  else if (p.steam > 0.05) { name = '正在沸腾…'; en = 'Boiling'; color = '#cf8a4a'; }
  else { name = '液态 · 水'; en = 'Liquid'; color = '#0e9488'; }
  const deg = Math.round(t);
  if (deg + name !== lastBadge) {
    tempNum.textContent = deg;
    phaseEl.textContent = en + ' · ' + name;
    hero.style.setProperty('--state', color);
    lastBadge = deg + name;
  }
  // 仅在相态名称变化时弹跳读数，拖动滑杆不再每帧 pop
  if (name !== lastPhase) {
    lastPhase = name;
    tempRead.classList.remove('pop'); void tempRead.offsetWidth; tempRead.classList.add('pop');
  }
  // 滚轮缩放时同步缩放滑杆（拖拽中不回写）
  if (document.activeElement !== zoomCtl) {
    const zv = Math.round(zoom * 100);
    zoomCtl.value = zv; zoomVal.textContent = zv + '%';
  }
  const near = [ -36, 24, 130 ].reduce((a, b) => Math.abs(b - targetTemp) < Math.abs(a - targetTemp) ? b : a);
  if (near !== lastNear) { lastNear = near; markPresets(near); }
}

/* ================= 渲染 ================= */
function setCommon(p, B, VP) {
  gl.uniformMatrix4fv(U(p, 'uVP'), false, VP);
  gl.uniform3f(U(p, 'uCam'), camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(U(p, 'uSun'), SUN[0], SUN[1], SUN[2]);
  gl.uniform1f(U(p, 'uTime'), simTime);
  return p;
}

let ema = 16, qTimer = 0;
function updateQuality(dt) {
  if (qLock > 0) { if (resAdj !== qLock) { resAdj = qLock; resize(); } return; }   // 手动画质锁定
  qTimer += dt;
  if (qTimer > 1.6) {
    qTimer = 0;
    const steps = [1.0, 0.85, 0.7, 0.55];
    let i = steps.indexOf(resAdj);
    if (ema > 26 && i < steps.length - 1) { resAdj = steps[i + 1]; resize(); }
    else if (ema < 15 && i > 0) { resAdj = steps[i - 1]; resize(); }
  }
}

function render() {
  resize();
  // 速度耦合倾斜：俯仰随角速度轻微前倾/后仰，横滚随偏航速度侧倾（松手滑行时最明显）
  const leanP = dragging ? 0 : clamp(-pitchV * 0.030, -0.055, 0.055);
  const roll = clamp(yawV * 0.045, -0.05, 0.05);
  const B = rollBasis(camBasis(yaw, pitch + leanP), roll);
  const asp = canvas.width / canvas.height;
  const view = m4View(CAM_POS, B);
  const proj = m4Persp(FOV, asp, 0.1, 120);
  const VP = m4Mul(proj, view);

  // 太阳屏幕位置
  let sunUV = [0.5, 0.5], sunVis = 0;
  {
    const px = camPos[0] + SUN[0] * 800, py = camPos[1] + SUN[1] * 800, pz = camPos[2] + SUN[2] * 800;
    const cx = VP[0] * px + VP[4] * py + VP[8] * pz + VP[12];
    const cy = VP[1] * px + VP[5] * py + VP[9] * pz + VP[13];
    const cw = VP[3] * px + VP[7] * py + VP[11] * pz + VP[15];
    if (cw > 0.01) {
      const nx = cx / cw, ny = cy / cw;
      if (Math.abs(nx) < 1.7 && Math.abs(ny) < 1.7) { sunVis = 1; sunUV = [nx * 0.5 + 0.5, ny * 0.5 + 0.5]; }
    }
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb);
  gl.viewport(0, 0, fboW, fboH);
  gl.disable(gl.BLEND);
  gl.clearColor(P.deep[0], P.deep[1], P.deep[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 天空
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progSky);
  gl.bindVertexArray(triVAO);
  gl.uniform3f(U(progSky, 'uCamR'), B.r[0], B.r[1], B.r[2]);
  gl.uniform3f(U(progSky, 'uCamU'), B.u[0], B.u[1], B.u[2]);
  gl.uniform3f(U(progSky, 'uCamF'), B.f[0], B.f[1], B.f[2]);
  gl.uniform1f(U(progSky, 'uTanF'), Math.tan(FOV / 2));
  gl.uniform1f(U(progSky, 'uAspect'), asp);
  gl.uniform3f(U(progSky, 'uSun'), SUN[0], SUN[1], SUN[2]);
  gl.uniform3f(U(progSky, 'uCam'), camPos[0], camPos[1], camPos[2]);
  gl.uniform1f(U(progSky, 'uTime'), simTime);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 海床
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(progSeabed);
  gl.bindVertexArray(seabedVAO);
  setCommon(progSeabed, B, VP);
  gl.uniform3f(U(progSeabed, 'uDeep'), P.deep[0], P.deep[1], P.deep[2]);
  gl.uniform1f(U(progSeabed, 'uIce'), P.ice);
  gl.uniform1f(U(progSeabed, 'uDeepIce'), P.deepIce);
  gl.uniform1f(U(progSeabed, 'uSteam'), P.steam);
  gl.uniform1f(U(progSeabed, 'uWarm'), P.warm);
  gl.drawElements(gl.TRIANGLES, seabedVAO.count, gl.UNSIGNED_SHORT, 0);

  // 水面（预乘 alpha 混合）
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progWater);
  gl.bindVertexArray(waterVAO);
  setCommon(progWater, B, VP);
  gl.uniform1f(U(progWater, 'uWaveAmp'), P.waveAmp * waveMul * (1 + 0.07 * idleAmt * Math.sin(idleClock * 0.4)));
  gl.uniform1f(U(progWater, 'uSteam'), P.steam);
  gl.uniform1f(U(progWater, 'uIce'), P.ice);
  gl.uniform1f(U(progWater, 'uDeepIce'), P.deepIce);
  gl.uniform3f(U(progWater, 'uWaterCol'), P.waterCol[0], P.waterCol[1], P.waterCol[2]);
  gl.uniform3f(U(progWater, 'uDeep'), P.deep[0], P.deep[1], P.deep[2]);
  gl.uniform4fv(U(progWater, 'uRipple'), ripples);
  gl.drawElements(gl.TRIANGLES, waterVAO.count, gl.UNSIGNED_INT, 0);

  // 蒸汽
  if (P.steam > 0.003) {
    gl.depthMask(false);
    gl.useProgram(progSteam);
    gl.bindVertexArray(steamVAO);
    gl.uniformMatrix4fv(U(progSteam, 'uVP'), false, VP);
    gl.uniform3f(U(progSteam, 'uCamR'), B.r[0], B.r[1], B.r[2]);
    gl.uniform3f(U(progSteam, 'uCamU'), B.u[0], B.u[1], B.u[2]);
    gl.uniform1f(U(progSteam, 'uTime'), simTime);
    gl.uniform1f(U(progSteam, 'uSteam'), P.steam);
    gl.drawElements(gl.TRIANGLES, steamVAO.count, gl.UNSIGNED_SHORT, 0);
    gl.depthMask(true);
  }
  // 雪
  if (P.snow > 0.003) {
    gl.depthMask(false);
    gl.useProgram(progSnow);
    gl.bindVertexArray(snowVAO);
    gl.uniformMatrix4fv(U(progSnow, 'uVP'), false, VP);
    gl.uniform1f(U(progSnow, 'uTime'), simTime);
    gl.uniform1f(U(progSnow, 'uSnow'), P.snow);
    gl.uniform1f(U(progSnow, 'uDPR'), dpr);
    gl.drawArrays(gl.POINTS, 0, 160);
    gl.depthMask(true);
  }
  gl.disable(gl.BLEND);

  // 后处理
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progPost);
  gl.bindVertexArray(triVAO);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(U(progPost, 'uTex'), 0);
  gl.uniform1f(U(progPost, 'uTime'), simTime);
  gl.uniform1f(U(progPost, 'uSteam'), P.steam);
  gl.uniform2f(U(progPost, 'uSunUV'), sunUV[0], sunUV[1]);
  gl.uniform1f(U(progPost, 'uSunVis'), sunVis);
  gl.uniform1f(U(progPost, 'uHdr'), extHDR ? 1 : 0);
  gl.uniform1f(U(progPost, 'uFlash'), flash);
  gl.uniform1f(U(progPost, 'uAberr'), aberr);
  gl.uniform1f(U(progPost, 'uShake'), shake * Math.sin(shakeAng));
  gl.uniform1f(U(progPost, 'uIdle'), idleAmt);
  gl.uniform2f(U(progPost, 'uShakeDir'), Math.cos(shakeAng * 0.7), Math.sin(shakeAng * 0.7));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

/* ================= 主循环 ================= */
updateStateParams();
resize();
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  ema = ema * 0.94 + (dt * 1000) * 0.06;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { $('#fps').textContent = Math.round(fpsN / fpsAcc) + ' fps' + (DEBUG ? ' · ' + Math.round(fboH) + 'p' : ''); fpsAcc = 0; fpsN = 0; }
  simTime += dt;

  // —— 温度缓动 + 变化率 ——
  const prevDisp = dispTemp;
  dispTemp += (targetTemp - dispTemp) * Math.min(1, dt * 1.6);
  if (Math.abs(targetTemp - dispTemp) < 0.05) dispTemp = targetTemp;
  tempVel = (dispTemp - prevDisp) / Math.max(dt, 1e-4);
  updateStateParams();

  // —— 相变跨越检测：闪白 + 震屏（max-not-sum 叠加）——
  const crossedIce = (P.ice > 0.5) !== (icePrev > 0.5);
  const crossedSteam = (P.steam > 0.5) !== (steamPrev > 0.5);
  if (crossedIce || crossedSteam) {
    flash = Math.max(flash, 0.34);
    shake = Math.max(shake, 0.010);
    shakeAng = Math.random() * Math.PI * 2; shakeFreq = 18 + Math.random() * 8;
    addRipple(camPos[0] * 0.6, camPos[2] * 0.6, 0.55);   // 相变冲击在水面荡一圈
  }
  icePrev = P.ice; steamPrev = P.steam;

  // —— 温度变化率驱动色差脉冲 ——
  const targetAberr = Math.min(Math.abs(tempVel) * 0.00075, 0.0072);
  aberr = Math.max(targetAberr, aberr - aberr * Math.min(1, dt * 2.2));
  flash *= Math.exp(-dt * 3.4);
  shake *= Math.exp(-dt * 3.0);
  shakeAng += dt * shakeFreq;
  if (flash < 5e-4) flash = 0;
  if (shake < 2e-5) shake = 0;

  // —— 相机惯性：欠阻尼弹簧（松手回弹）——
  if (!dragging) {
    const kDamp = 5.6;                              // 阻尼系数：轻微过冲后自然滑停
    yaw += yawV * dt; pitch += pitchV * dt;
    yawV -= yawV * kDamp * dt;
    pitchV -= pitchV * kDamp * dt;
    yaw = clamp(yaw, -1.25, 1.25); pitch = clamp(pitch, -1.15, -0.15);
    if (Math.abs(yawV) < 0.004) yawV = 0;
    if (Math.abs(pitchV) < 0.004) pitchV = 0;
  }

  // —— 滚轮缩放弹簧：1-exp(-k·dt) 帧率无关 ——
  zoom = clamp(zoom + zoomV * dt * 2.4, 0, 1);
  zoomV -= zoomV * Math.min(1, dt * 7.5);
  if (Math.abs(zoomV) < 0.01) zoomV = 0;

  // —— idle 呼吸：静止 3 秒后缓慢升起 ——
  const quiet = simTime - lastActive;
  idleAmt = clamp((quiet - 3) / 5, 0, 1);
  if (idleAmt > 0) idleClock += dt * (1 + idleAmt);
  // 相机轻微漂浮 + 水面波幅微呼吸（乘进 uWaveAmp，见 render）
  const drift = idleAmt * 0.5;
  camPos[0] = CAM_POS[0] + Math.sin(idleClock * 0.21) * drift * 0.30;
  camPos[1] = CAM_POS[1] + Math.sin(idleClock * 0.17 + 1.3) * drift * 0.14;
  camPos[2] = CAM_POS[2] * (1 + zoom * 0.9) + Math.cos(idleClock * 0.13) * drift * 0.30;

  updateQuality(dt);
  render();
  updateUI();
  window.__frames++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
