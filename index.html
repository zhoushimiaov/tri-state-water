<meta name="description" content="三态之水 Tri-State Water —— 单文件零依赖的 WebGL2 实时水场景，温度驱动冰 / 水 / 汽三态连续相变。">
<title>三态之水 · Tri-State Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  三态之水 (Tri-State Water)
  ------------------------------------------------------------
  视觉与技术路线复刻自开源项目 clearwater (github.com/Aureliengmz/clearwater, MIT)
  —— 浅水碧波 + 水底焦散 + 太阳眩光 + 交互涟漪 的实时 WebGL2 场景。
  本文件为从零手写的独立实现，并新增“温度三态”系统：
    凝固态(冰) / 液态(水) / 蒸发态(汽)，由温度滑杆连续驱动。
  无依赖 · 无构建 · 单文件。直接用浏览器打开即可。
-->
<style>
  :root {
    color-scheme: dark;
    --ink:#f4f7f7; --dim:#b8c8cb; --quiet:#8ea4aa;
    --line:rgba(233,250,252,.14); --panel:rgba(8,25,31,.76);
    --focus:#a7e7fa;
    --font:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --accent:#88ebdb;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#071b24;
    color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }
  body::after { content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg,rgba(3,20,28,.29),transparent 30%,transparent 78%,rgba(3,20,28,.10)); }
  button,input { font:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
  .hidden { display:none !important; }
  #title { position:fixed; left:clamp(22px,3.4vw,58px); top:clamp(22px,4.3vh,48px);
    z-index:5; max-width:min(440px,calc(100vw - 40px)); pointer-events:none; user-select:none;
    filter:drop-shadow(0 2px 12px rgba(1,11,18,.5)); }
  #title .eyebrow { display:flex; align-items:center; gap:12px; margin-bottom:14px;
    color:#d0edf0; font:500 10px/1.3 var(--mono); letter-spacing:.17em; text-transform:uppercase; }
  #title .eyebrow::before { content:''; width:25px; height:1px; background:var(--accent); }
  #title b { display:block; font-size:clamp(29px,3vw,43px); line-height:1.06; font-weight:500;
    letter-spacing:-.055em; }
  #title span { display:block; margin-top:11px; color:#d1dee0; font-size:12px;
    line-height:1.6; letter-spacing:.06em; }
  #hint { position:fixed; right:clamp(22px,3.4vw,58px); top:clamp(24px,4.5vh,50px); z-index:5;
    color:#d7e9eb; font-size:12px; font-weight:400; line-height:2;
    text-align:right; text-shadow:0 2px 12px rgba(1,11,18,.65); user-select:none; pointer-events:none; }
  #hint .hint-heading { font:500 10px/1.5 var(--mono); letter-spacing:.16em;
    color:#effffc; margin-bottom:9px; }
  #hint kbd { display:inline-block; font:500 10px/1.45 var(--mono); color:var(--ink);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.26); background:rgba(5,17,22,.4);
    border-radius:4px; padding:2px 6px; margin-inline:2px; }
  #panel { position:fixed; left:50%; bottom:clamp(14px,3.8vh,38px); transform:translateX(-50%);
    z-index:10; display:grid; grid-template-columns:auto minmax(220px,1fr) auto;
    align-items:center; gap:26px; width:min(890px,calc(100vw - 36px)); padding:19px 24px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 22px 70px rgba(1,12,17,.33), inset 0 1px 0 rgba(255,255,255,.075);
    backdrop-filter:blur(24px) saturate(1.22); -webkit-backdrop-filter:blur(24px) saturate(1.22);
    user-select:none; }
  #panel::before { content:''; position:absolute; left:24px; right:24px; top:0;
    height:1px; background:linear-gradient(90deg,transparent,rgba(237,255,255,.22),transparent);
    pointer-events:none; }
  .field-label { display:block; margin-bottom:12px; font:500 10px/1.3 var(--mono);
    color:#b4cdd2; text-transform:uppercase; letter-spacing:.13em; }
  .presetRow { display:flex; gap:5px; padding:4px; background:rgba(0,13,18,.36);
    border:1px solid rgba(235,252,253,.09); border-radius:9px; }
  .preset { border:0; background:transparent; color:#bed0d4; padding:9px 17px; min-height:37px;
    border-radius:6px; cursor:pointer; white-space:nowrap; font-size:13px; font-weight:500;
    transition:background .2s,color .2s,box-shadow .2s; }
  .preset:hover { color:white; background:rgba(255,255,255,.09); }
  .preset.on { color:#082126; background:#e2f8f5; box-shadow:0 1px 8px rgba(6,20,25,.24); }
  #sliderWrap { min-width:0; display:flex; flex-direction:column; gap:3px; }
  .sliderTop { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .sliderTop .field-label { margin-bottom:0; }
  #targetReading { color:#e2f7f5; font:500 13px/1.3 var(--mono);
    font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  #slider { appearance:none; -webkit-appearance:none; background:transparent; cursor:pointer;
    width:100%; height:28px; margin:0; }
  #slider::-webkit-slider-runnable-track { height:5px; border-radius:99px; background:linear-gradient(
    90deg,#92d8f4 0%,#92d8f4 19.35%,#8ae4d8 19.35%,#64cdb8 73.1%,#e4b47a 73.1%,#f1a46e 100%); }
  #slider::-moz-range-track { height:5px; border-radius:99px; background:linear-gradient(
    90deg,#92d8f4 0%,#92d8f4 19.35%,#8ae4d8 19.35%,#64cdb8 73.1%,#e4b47a 73.1%,#f1a46e 100%); }
  #slider::-webkit-slider-thumb { -webkit-appearance:none; width:17px; height:17px; margin-top:-6px;
    border:3px solid #f1fbfb; border-radius:50%; background:#244850;
    box-shadow:0 0 0 3px rgba(224,250,246,.16),0 2px 9px rgba(0,0,0,.4);
    transition:box-shadow .2s, transform .2s; }
  #slider::-moz-range-thumb { width:11px; height:11px; border:3px solid #f1fbfb;
    border-radius:50%; background:#244850; box-shadow:0 0 0 3px rgba(224,250,246,.16),0 2px 9px rgba(0,0,0,.4); }
  #slider:hover::-webkit-slider-thumb { transform:scale(1.1); box-shadow:0 0 0 5px rgba(224,250,246,.22); }
  #ticks { position:relative; height:14px; color:#9db5ba; font:500 10px/1.4 var(--mono);
    font-variant-numeric:tabular-nums; }
  #ticks span { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; }
  #ticks span::before { content:''; position:absolute; height:4px; width:1px;
    background:#9db5ba; opacity:.6; top:-6px; left:50%; }
  #ticks span:first-child { left:0; transform:none; }
  #ticks span:first-child::before { left:3px; }
  #ticks span:last-child { right:0; transform:none; }
  #ticks span:last-child::before { left:auto; right:3px; }
  #badge { --state:#88ebdb; display:flex; align-items:center; gap:12px;
    padding-left:24px; min-width:162px; border-left:1px solid var(--line); }
  #badge i { display:block; flex:none; width:7px; height:7px; margin-top:17px; align-self:flex-start;
    background:var(--state); border-radius:50%; box-shadow:0 0 14px var(--state); }
  #badge .badgeCopy { display:grid; gap:3px; }
  #badge small { font:500 10px/1.4 var(--mono); color:#acc5c9; letter-spacing:.1em; }
  #badge b { color:#effefe; font:500 23px/1.15 var(--mono); letter-spacing:-.06em;
    font-variant-numeric:tabular-nums; }
  #badge span { color:var(--state); font-size:11px; font-weight:500; white-space:nowrap; }
  #fps { position:fixed; right:18px; bottom:8px; z-index:11; color:#d3e8e9;
    font:500 10px var(--mono); display:none; }
  #fatal { position:fixed; inset:0; z-index:99; display:none; place-items:center;
    padding:24px; background:#071b24; color:#d5e8ea; text-align:center; font-size:15px; line-height:2; }
  #title,#hint,#panel { transition:opacity .32s ease,translate .32s ease; }
  .ui-off { opacity:0 !important; pointer-events:none !important; }
  #panel.ui-off { translate:0 20px; }
  #title.ui-off,#hint.ui-off { translate:0 -10px; }
  @media (max-width:860px) {
    #panel { grid-template-columns:minmax(0,1fr) auto; gap:16px 24px; max-width:660px; padding:17px 20px; }
    #sliderWrap { grid-column:1 / -1; grid-row:2; }
    #badge { grid-column:2; grid-row:1; }
  }
  @media (max-width:640px) {
    #title { left:22px; top:23px; }
    #title b { font-size:31px; }
    #title .eyebrow { font-size:9px; margin-bottom:10px; }
    #title span { font-size:11px; }
    #hint { display:none; }
    #panel { bottom:max(12px,env(safe-area-inset-bottom)); width:calc(100vw - 24px);
      padding:14px 15px; gap:14px 8px; }
    .preset { padding:9px 11px; min-height:36px; }
    .field-label { font-size:9px; margin-bottom:9px; }
    #badge { min-width:0; padding-left:13px; gap:8px; }
    #badge b { font-size:19px; }
    #badge small { font-size:9px; }
    #badge i { display:none; }
  }
  @media (max-width:370px) {
    #panel { grid-template-columns:1fr; gap:15px; }
    #badge { grid-column:1; grid-row:2; flex-direction:row; padding:0; border:0; }
    #badge .badgeCopy { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
    #badge small { display:none; }
    #sliderWrap { grid-column:1; grid-row:3; }
    .presetRow { width:max-content; }

  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>

<body>
<canvas id="gl"></canvas>

<header id="title" aria-label="项目标题"><div class="eyebrow">A STUDY OF MATTER · 001</div><b>Tri-State Water</b><span>三态之水 / 温度驱动的实时材质实验</span></header>
<aside id="hint" aria-label="操作说明"><div class="hint-heading">INTERACTIVE MATERIAL STUDY / WEBGL2</div>拖动环视 &nbsp;·&nbsp; 滚轮缩放<br>轻触水面生成涟漪<br><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换相态 &nbsp;<kbd>H</kbd> 隐藏界面</aside>

<section id="panel" role="group" aria-label="水体相态与温度控制">
  <div class="panelLead">
    <label class="field-label">相态 / PHASE</label>
    <div class="presetRow" role="group" aria-label="温度预设">
      <button class="preset" data-t="-36" aria-pressed="false" title="切换凝固态（快捷键 1）">冰</button>
      <button class="preset on" data-t="24" aria-pressed="true" title="切换液态（快捷键 2）">水</button>
      <button class="preset" data-t="130" aria-pressed="false" title="切换蒸发态（快捷键 3）">汽</button>
    </div>
  </div>
  <div id="sliderWrap">
    <div class="sliderTop"><label class="field-label" for="slider">温度 / TEMPERATURE</label><output id="targetReading" for="slider">24°C</output></div>
    <input id="slider" type="range" min="-36" max="150" step="1" value="24" aria-label="水温，范围 -36 到 150 摄氏度">
    <div id="ticks" aria-hidden="true"><span>-36°</span><span style="left:19.35%">0° 冰点</span><span style="left:73.1%">100° 沸点</span><span>150°</span></div>
  </div>
  <div id="badge" aria-label="当前水体状态">
    <i aria-hidden="true"></i>
    <div class="badgeCopy"><small>CURRENT STATE</small><b>24°C</b><span role="status" aria-live="polite">液态 · 水</span></div>
  </div>
</section>
<div id="fps"></div>
<div id="fatal"><div>此演示需要支持 <b>WebGL2</b> 的浏览器。<br>请使用较新的 Chrome / Edge / Firefox / Safari 打开。</div></div>

<script>
'use strict';
window.__frames = 0;
window.__suspendRendering = false; // 截图/浏览器测试可暂停 GPU 绘制，保留最后一帧
window.addEventListener('error', e => { window.__lastError = String(e.message || e); });
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const ssj = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: true });
if (!gl) { $('#fatal').style.display = 'grid'; throw new Error('no webgl2'); }
const extHDR = gl.getExtension('EXT_color_buffer_float');
const floatLinear = !!gl.getExtension('OES_texture_float_linear');
// Half-float NEAREST upscaling accentuates distant wave aliasing; prefer LDR linear filtering
// on drivers without floating-point linear texture filtering.
const useHDR = !!extHDR && floatLinear;

// WebGL 上下文丢失保护：提示并在恢复后自动重载
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  const f = $('#fatal');
  f.firstElementChild.innerHTML = '图形上下文意外丢失。<br>正在尝试恢复……若长时间无响应，请刷新页面。';
  f.style.display = 'grid';
});
canvas.addEventListener('webglcontextrestored', () => location.reload());

// —— UI 元素引用（提前到 URL 预置之前） ——
const slider = $('#slider'), badge = $('#badge'), targetReading = $('#targetReading');
const badgeT = badge.querySelector('b'), badgeS = badge.querySelector('span');
const presetBtns = [...document.querySelectorAll('.preset')];
function markPresets(near) {
  presetBtns.forEach(b => {
    const on = +b.dataset.t === near;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

const params = new URLSearchParams(location.search);
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const LOW_QUALITY = params.get('quality') === 'low' ||
  (window.matchMedia('(max-width: 640px)').matches && (navigator.hardwareConcurrency || 4) <= 4);
const DEBUG = params.has('debug');
if (DEBUG) $('#fps').style.display = 'block';

/* ================= 迷你矩阵库 ================= */
function m4Persp(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0,  0, f, 0, 0,  0, 0, (far + near) * nf, -1,  0, 0, 2 * far * near * nf, 0]);
}
function m4Mul(a, b) { // column-major a*b
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  return o;
}
function camBasis(yaw, pitch) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const f = [sy * cp, sp, -cy * cp];
  const r = [cy, 0, sy];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  return { f, r, u };
}
function rollBasis(B, roll) {
  const c = Math.cos(roll), s = Math.sin(roll);
  return { f: B.f,
    r: [B.r[0] * c + B.u[0] * s, B.r[1] * c + B.u[1] * s, B.r[2] * c + B.u[2] * s],
    u: [B.u[0] * c - B.r[0] * s, B.u[1] * c - B.r[1] * s, B.u[2] * c - B.r[2] * s] };
}
function m4View(eye, B) {
  const { f, r, u } = B;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  return new Float32Array([
    r[0], u[0], -f[0], 0,  r[1], u[1], -f[1], 0,  r[2], u[2], -f[2], 0,
    -dot(r, eye), -dot(u, eye), dot(f, eye), 1]);
}
const v3norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

/* ================= GLSL 公共块 ================= */
const NOISE = `
float hash1(vec2 p){ p = fract(p*vec2(127.1,311.7)); p += dot(p,p+34.5); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ float n = hash1(p); return vec2(n, hash1(p+n+17.13)); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = hash1(i), b = hash1(i+vec2(1,0)), c = hash1(i+vec2(0,1)), d = hash1(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + vec2(19.7,7.3); a *= 0.5; }
  return s;
}
vec3 worley(vec2 p){
  vec2 n = floor(p), f = fract(p);
  float F1 = 8.0, F2 = 8.0, id = 0.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j));
    vec2 o = hash2(n+g);
    float d = length(g+o-f);
    if(d < F1){ F2 = F1; F1 = d; id = hash1(n+g+31.7); }
    else if(d < F2){ F2 = d; }
  }
  return vec3(F1, F2, id);
}
float web(vec2 p){ vec3 w = worley(p); return 1.0 - smoothstep(0.02, 0.16, w.y - w.x); }
vec3 skyColor(vec3 rd, vec3 sun){
  float y = max(rd.y, 0.0);
  vec3 zen = vec3(0.13, 0.34, 0.52);           // 自然青蓝的天顶，避免过度饱和
  vec3 hor = vec3(0.66, 0.85, 0.91);           // 空气散射后的浅青灰地平线
  vec3 c = mix(hor, zen, pow(y, 0.73));
  // 近地平线的暖色微光（阳光散射）
  c = mix(c, vec3(0.96, 0.91, 0.83), (1.0 - smoothstep(0.0, 0.35, y))*0.19);
  float sd = max(dot(rd,sun), 0.0);
  c += vec3(1.0,0.87,0.70)*pow(sd,8.0)*0.18;
  c += vec3(1.0,0.93,0.84)*pow(sd,320.0)*2.0;
  return c;
}
// 远山：两层山脊剪影（大气透视，越远越淡）
vec3 mountains(vec3 rd, vec3 sky){
  float y = rd.y;
  if(y > 0.3) return sky;
  // 山脊高度用径向角度采样，保证环视连续
  float az = atan(rd.z, rd.x);
  // 远层：低缓，约 1200m 外，被大气推成蓝白
  float r1 = 0.055*fbm(vec2(az*2.6, 0.0)) + 0.028*fbm(vec2(az*7.1, 4.7))
           + 0.014*sin(az*3.0 + 1.7);
  // 近层：更高峻，约 600m 外
  float r2 = 0.085*fbm(vec2(az*2.1 + 9.3, 0.0)) + 0.042*fbm(vec2(az*5.7 + 3.1, 8.2))
           + 0.020*sin(az*2.2 + 5.2);
  vec3 col = sky;
  if(y < r1){                                    // 远山：雾蓝
    float depth = 1.0 - smoothstep(r1 - 0.02, r1, y);
    vec3 mc = mix(vec3(0.52, 0.66, 0.82), vec3(0.30, 0.44, 0.62), smoothstep(0.0, 0.06, y));
    col = mix(col, mc, depth*0.85);
  }
  if(y < r2){                                    // 近山：深青蓝
    float depth = 1.0 - smoothstep(r2 - 0.025, r2, y);
    vec3 mc = mix(vec3(0.30, 0.42, 0.56), vec3(0.13, 0.22, 0.34), smoothstep(0.0, 0.08, y));
    col = mix(col, mc, depth*0.94);
  }
  // 山脚与水线衔接的雾化
  float hz = 1.0 - smoothstep(0.0, 0.02, y);
  col = mix(col, vec3(0.80, 0.89, 0.96), hz*0.35);
  return col;
}`;

/* ================= 着色器 ================= */
// —— 水面顶点：多向正弦波叠加 + 沸腾扰动 + 交互涟漪（解析法线）
const waveDef = [];
{
  let seed = 7, rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const waveCount = LOW_QUALITY ? 14 : 22;
  for (let i = 0; i < waveCount; i++) {
    const t = i / (waveCount - 1);
    const len = 7.0 * Math.pow(0.82, i * 22 / 21) * (0.85 + rand() * 0.3);
    // 保证每周期 >=3.2 网格间距，防止低画质和远景形成水面碎片/折线伪影。
    if (len < (40 / (LOW_QUALITY ? 140 : 300)) * 3.2) continue;
    // 风向占主导，叠加少量横向涌浪；避免完全随机方向形成“沸腾的海面”。
    const crossSwell = i % 5 === 0;
    const ang = (crossSwell ? 1.32 : -0.43) + (rand() - 0.5) * (0.48 + t * 1.05);
    const k = 2 * Math.PI / len;
    const amp = len * (0.010 + rand() * 0.005) * (crossSwell ? 0.55 : 1.0);
    const w = Math.sqrt(9.8 * k) * (0.92 + rand() * 0.16);                    // 深水色散关系
    waveDef.push({ dx: Math.cos(ang), dz: Math.sin(ang), k, amp, w, ph: rand() * 6.28 });
  }
}
const WAVE_CODE = waveDef.map(v =>
  `{ float phz = dot(vec2(${v.dx.toFixed(5)},${v.dz.toFixed(5)}), p)*${v.k.toFixed(5)} + uTime*${v.w.toFixed(5)} + ${v.ph.toFixed(5)};
     h += ${v.amp.toFixed(6)}*sin(phz);
     grad += vec2(${v.dx.toFixed(5)},${v.dz.toFixed(5)})*(${(v.amp * v.k).toFixed(6)}*cos(phz)); }`).join('\n');

const VS_WATER = `
uniform mat4 uVP;
uniform float uTime, uWaveAmp, uSteam;
uniform vec3 uCam;
uniform vec4 uRipple[24];
layout(location = 0) in vec3 aPos;
out vec3 vW; out vec3 vN; out float vH;
void main(){
  vec2 p = aPos.xz;
  float h = 0.0; vec2 grad = vec2(0.0);
  ${WAVE_CODE}
  // Long-lived boiling ripples use wavelengths that the grid can actually resolve.
  // Derivative sign matches d/dz sin(p.y*k - time): positive k, not negative.
  float boilAmp = uSteam*0.009;
  float boilA = p.x*3.6 + uTime*5.2;
  float boilB = p.y*4.4 - uTime*4.8;
  h += boilAmp*sin(boilA)*sin(boilB);
  grad += boilAmp*vec2(3.6*cos(boilA)*sin(boilB),
                       4.4*sin(boilA)*cos(boilB));
  for(int i=0;i<24;i++){
    vec4 r = uRipple[i];
    float age = uTime - r.z;
    if(r.w > 0.0 && age > 0.0 && age < 5.0){
      vec2 dv = p - r.xy;
      float d = max(length(dv), 1e-4);
      float front = d - age*2.2;
      float env = exp(-front*front*3.5)*exp(-age*1.3)*r.w;
      h += env*cos(front*8.0);
      float dhdd = env*(-7.0*front-1.3)*cos(front*8.0) - env*sin(front*8.0)*8.0;
      grad += (dhdd/d)*dv;
    }
  }
  // Fade distant geometry displacement to avoid undersampling at grazing angles.
  float farFade = mix(0.14, 1.0, 1.0-smoothstep(12.0, 29.0, length(p-uCam.xz)));
  h *= uWaveAmp*farFade;
  grad *= uWaveAmp*farFade;
  vec3 wp = vec3(p.x, h, p.y);
  vW = wp; vN = vec3(-grad.x, 1.0, -grad.y); vH = h;
  gl_Position = uVP*vec4(wp, 1.0);
}`;

const FS_WATER = `
precision highp float;
uniform vec3 uCam, uSun, uWaterCol, uDeep;
uniform float uTime, uIce, uSteam, uDeepIce, uWarm;
in vec3 vW; in vec3 vN; in float vH;
out vec4 outColor;
${NOISE}
void main(){
  vec3 V = normalize(uCam - vW);
  // 以两组反向平流噪声构建波纹微法线；近场微细、远场不出现规则塑料纹。
  const float e = 0.12;
  vec2 pd = vW.xz * 1.65 + uTime * vec2(0.17, 0.10);
  vec2 g1 = vec2(vnoise(pd + vec2(e,0.0)) - vnoise(pd - vec2(e,0.0)),
                 vnoise(pd + vec2(0.0,e)) - vnoise(pd - vec2(0.0,e))) / (2.0*e);
  vec2 pd2 = vW.xz * 5.8 - uTime * vec2(0.27, 0.19);
  vec2 g2 = vec2(vnoise(pd2 + vec2(e,0.0)) - vnoise(pd2 - vec2(e,0.0)),
                 vnoise(pd2 + vec2(0.0,e)) - vnoise(pd2 - vec2(0.0,e))) / (2.0*e);
  vec2 capillary = vec2(sin(vW.x*13.2 + vW.z*5.3 + uTime*2.4),
                        sin(vW.z*15.6 - vW.x*4.1 - uTime*1.8));
  float waveDetail = mix(0.095, 0.015, uIce) * (1.0 + 0.24*uSteam);
  vec2 ng = (g1*0.52 + g2*0.18 + capillary*0.065) * waveDetail;
  vec3 N = normalize(vN + vec3(-ng.x, 0.0, -ng.y));
  float NdV = clamp(dot(N,V), 0.0, 1.0);
  // 水的 F0 ≈ 0.0204（空气/水 IOR 1.0 / 1.333），Schlick 随视角增强掠射反射。
  float fresnel = 0.0204 + 0.9796*pow(1.0-NdV,5.0);
  vec3 R = reflect(-V,N);
  R.y = abs(R.y)*0.98 + 0.02;
  vec3 reflection = mountains(R, skyColor(R,uSun));
  float sunDot = max(dot(R,uSun),0.0);
  // Screen-space filtered highlight prevents small far-field triangles from flashing.
  float highlightFootprint = max(fwidth(sunDot), 0.0001);
  float sharpness = mix(1050.0, 480.0, uSteam) / (1.0 + highlightFootprint*280.0);
  float specular = pow(sunDot, sharpness)*1.35/(1.0 + highlightFootprint*25.0)
                 + pow(sunDot, mix(110.0,65.0,uSteam))*0.12
                 + pow(sunDot,18.0)*0.028;
  float sparkleMask = 0.70 + 0.30*vnoise(vW.xz*8.0 - uTime*vec2(0.19,0.14));
  specular *= sparkleMask;

  // 水柱透射/体散射近似：保留海床细节，随视线斜率自然增加厚度。
  float path = 2.35 / clamp(V.y,0.20,1.0);
  float opticalBody = clamp(1.0-exp(-path*(0.14 + uWarm*0.045 + uSteam*0.07)),0.0,0.77);
  float crest = smoothstep(-0.12,0.17,vH);
  vec3 scattered = mix(uWaterCol,uDeep,0.23) * (0.75 + 0.20*crest);
  float alpha = fresnel + (1.0-fresnel)*opticalBody;

  vec3 col = reflection*fresnel
           + scattered*(1.0-fresnel)*opticalBody
           + vec3(1.0,0.91,0.74)*specular;

  if(uIce > 0.001){
    vec3 cell = worley(vW.xz*1.35+13.7);
    float cracks = 1.0-smoothstep(0.02,0.12,cell.y-cell.x);
    float frost = fbm(vW.xz*3.1+5.0);
    vec3 iceCol = vec3(0.59,0.76,0.84)*(0.68+0.44*frost);
    iceCol *= 1.0 - mix(0.30,0.47,uDeepIce)*cracks;
    iceCol += vec3(0.79,0.92,0.99)*cracks*0.07;
    iceCol = mix(iceCol,vec3(0.78,0.88,0.92)*(0.69+0.38*frost),uDeepIce*0.74);
    float iceSun = pow(sunDot,950.0)*0.62;
    vec2 cellId = floor(vW.xz*26.0), cellUV = fract(vW.xz*26.0);
    float tw = step(0.996,hash1(cellId+floor(uTime*3.0)))*

    vec3 iceLight = iceCol*(0.67+0.28*max(uSun.y,0.0))
                  + vec3(0.85,0.94,1.0)*iceSun
                  + vec3(1.0)*tw*0.75*frost;
    float iceAlpha = clamp(fresnel+0.56+uDeepIce*0.34,0.0,0.985);
    col = mix(col,iceLight*iceAlpha,uIce);
    alpha = mix(alpha,iceAlpha,uIce);
  }
  float dist = length(uCam-vW);
  float fog = 1.0-exp(-dist*0.045);
  float fogOpacity = fog*0.93;
  // Premultiplied layer-over math; color and alpha use the same fog opacity.
  col = col*(1.0-fogOpacity) + uDeep*fogOpacity;
  alpha = alpha*(1.0-fogOpacity) + fogOpacity;
  outColor = vec4(col,alpha);
}`;

precision highp float;
uniform vec3 uCam, uSun, uDeep;
uniform float uTime, uIce, uSteam, uWarm, uDeepIce;
in vec3 vW;
out vec4 outColor;
${NOISE}
void main(){
  vec2 p = vW.xz;
  vec3 w = worley(p*2.05);
  float mask = 1.0 - smoothstep(0.34, 0.50, w.x);
  vec3 pcol = mix(vec3(0.50,0.45,0.38), vec3(0.66,0.62,0.55), hash1(vec2(w.z*7.1, w.z*1.3)));
  pcol = mix(pcol, vec3(0.38,0.33,0.30), step(0.75, hash1(vec2(w.z*13.7, w.z*2.9))));
  float bump = 1.0 - smoothstep(0.0, 0.55, w.x);
  vec3 sand = vec3(0.55,0.49,0.38)*(0.78 + 0.42*vnoise(p*8.0) + 0.18*vnoise(p*31.0));
  vec3 alb = mix(sand, pcol*(0.66 + 0.38*bump), mask*0.80);

  // 轻微流场扭曲破除 Worley 重复网格，收敛焦散的面积和亮度。
  vec2 warp = (vec2(vnoise(p*0.62 + uTime*vec2(0.06,0.04)),
                    vnoise(p*0.62 + vec2(11.2,3.7) - uTime*vec2(0.04,0.05))) - 0.5)*0.32;
  float c1 = web((p+warp)*0.92 + vec2(uTime*0.11, uTime*0.08));
  float c2 = web((p-warp)*1.47 + vec2(-uTime*0.10, uTime*0.12)+4.7);
  float raw = clamp(c1*0.52 + c2*0.48, 0.0, 1.0);
  float ca = mix(pow(raw, 2.45), pow(raw, 3.1)*1.2, uIce);
  float caust = ca*(0.35 + 0.65*max(uSun.y, 0.0));
  vec3 lit = alb*(0.48 + 0.50*max(uSun.y, 0.0)) + alb*caust*vec3(1.0,0.97,0.82)*1.08;

  vec3 V = normalize(uCam - vW);
  float dist = length(uCam - vW);
  float path = 2.35/clamp(V.y, 0.18, 1.0);
  vec3 sigma = vec3(0.40,0.13,0.10)*(1.0 + 0.9*uWarm + 0.45*uSteam)*(1.0 - uIce*(0.42 + 0.40*uDeepIce));
  vec3 T = exp(-sigma*path);
  float dfog = 1.0 - exp(-dist*0.055);
  vec3 col = mix(lit*T + uDeep*(1.0-T), uDeep, dfog);
  outColor = vec4(col, 1.0);
}`;

const FS_POST = `
precision highp float;
uniform sampler2D uTex;
uniform float uTime, uSteam, uSunVis, uHdr;
uniform float uFlash, uAberr, uShake, uIdle;
uniform vec2 uSunUV;
uniform vec2 uShakeDir;
in vec2 vUv;
out vec4 outColor;
${NOISE}
void main(){
  vec2 uv = vUv;
  uv += uShakeDir*uShake;
  float shimmerMask = 1.0 - smoothstep(0.15, 1.0, uv.y);
  vec2 so = vec2(vnoise(uv*vec2(55.0,30.0) + uTime*vec2(2.0,4.0)),
                 vnoise(uv*vec2(50.0,28.0) - uTime*vec2(2.4,3.2))) - 0.5;
  uv += so*0.007*uSteam*shimmerMask;

  if(uAberr > 0.0015){
    vec2 ab = (uv - 0.5)*uAberr;
    col = vec3(texture(uTex, uv - ab).r, texture(uTex, uv).g, texture(uTex, uv + ab).b);
  } else {
    col = texture(uTex, uv).rgb;
  }
  col += vec3(0.90,0.97,1.0)*uFlash*(0.6 + 0.4*hash1(gl_FragCoord.xy));

  float haze = fbm(uv*vec2(3.0,2.2) + vec2(0.0, -uTime*0.05));
  col = mix(col, vec3(0.75,0.80,0.84), uSteam*0.07*haze);

  if(uSunVis > 0.001){
    vec2 dir = uSunUV - uv;
    vec3 acc = vec3(0.0);
    for(int i=0;i<12;i++){
      float t = float(i)/11.0;
      acc += max(texture(uTex, uv + dir*t*0.6).rgb - thr, 0.0)*(1.0-t);
    }
    col += acc/12.0*1.32*uSunVis;
    vec3 s2 = vec3(0.0);
    for(int i=-3;i<=3;i++){
      s2 += max(texture(uTex, uv + (uSunUV-uv)*0.02 + vec2(float(i)*0.027, 0.0)).rgb - thr, 0.0);
    }
    col += s2/7.0*0.28*uSunVis;
  }

  col *= 1.05;
  col = clamp((col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14), 0.0, 1.0);
  col = pow(col, vec3(1.0/2.2));
  vec2 q = vUv - 0.5;
  float vig = 1.0 - (0.45 - 0.05*uIdle)*dot(q,q);
  col *= vig;
  float grain = (hash1(gl_FragCoord.xy + floor(uTime*12.0)) - 0.5)*(0.005 + 0.002*uIdle);
  col += grain;
  outColor = vec4(col, 1.0);
}`;

/* ================= 编译辅助 ================= */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, '#version 300 es\n' + vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, '#version 300 es\n' + fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  p._u = {};
  return p;
}
function U(p, n) { return p._u[n] !== undefined ? p._u[n] : (p._u[n] = gl.getUniformLocation(p, n)); }

const progWater = program(VS_WATER, FS_WATER);
const progSeabed = program(VS_SEABED, FS_SEABED);

/* ================= 几何体 ================= */
function vao(bindFn, attrs) {
  const v = gl.createVertexArray();
  gl.bindVertexArray(v);
  bindFn();
  gl.bindVertexArray(null);
  return v;
}
function attrib(loc, data, size, stride = 0, offset = 0) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
}

    verts.push(-half + 40 * i / N, 0, -half + 40 * j / N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const ib = gl.createBuffer();
  const v = vao(() => {
    attrib(0, new Float32Array(verts), 3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
  });
  v.count = idx.length;

  for (let i = 0; i < 160; i++) {
    seeds[i * 4] = Math.random() * 14 - 7;
    seeds[i * 4 + 1] = Math.random() * 4.6;
    seeds[i * 4 + 2] = Math.random() * 12 - 9;
    seeds[i * 4 + 3] = Math.random() * 100;
  }
  return vao(() => attrib(0, seeds, 4));
})();

/* ================= 场景 FBO ================= */
let sceneFBO = null, fboW = 0, fboH = 0;
let dpr = Math.min(window.devicePixelRatio || 1, LOW_QUALITY ? 1 : 1.75);
let resAdj = LOW_QUALITY ? 0.7 : 1.0;
function makeFBO(w, h) {
  if (sceneFBO) {
    gl.deleteTexture(sceneFBO.tex);
    gl.deleteRenderbuffer(sceneFBO.depth);
    gl.deleteFramebuffer(sceneFBO.fb);
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (useHDR) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const filter = gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  // 离屏目标必须有深度缓冲，否则海床、水面与粒子的遮挡测试失效。
  const depth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindRenderbuffer(gl.RENDERBUFFER, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (status !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Scene framebuffer incomplete: ' + status);
  sceneFBO = { tex, fb, depth };
  fboW = w; fboH = h;
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, LOW_QUALITY ? 1 : 1.75);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const fw = Math.max(2, Math.floor(w * resAdj)), fh = Math.max(2, Math.floor(h * resAdj));
  if (fw !== fboW || fh !== fboH) makeFBO(fw, fh);
}
window.addEventListener('resize', resize);

/* ================= 场景状态 ================= */
const SUN = v3norm([-0.32, 0.42, -0.85]);
const CAM_POS = [0, 1.65, 7.2];
const FOV = 55 * Math.PI / 180;
let yaw = 0, pitch = -0.52;
let yawV = 0, pitchV = 0;               // 相机角速度（惯性）
let zoom = 0, zoomV = 0;                // 滚轮缩放（0 近 → 1 远）
let camPos = CAM_POS.slice();           // 动态相机位置（含 idle 呼吸）
let simTime = 0;
let targetTemp = 24, dispTemp = 24;
let tempVel = 0;                        // 温度变化率 °C/s（驱动色差脉冲）
// —— 相变冲击 / 打击感特效状态 ——
let flash = 0, aberr = 0, shake = 0, shakeAng = 0, shakeFreq = 0;
let icePrev = 0, steamPrev = 0;         // 相变跨越检测
let idleAmt = 0;                        // 静止呼吸权重
let idleClock = 0;                      // 仅静止时前进的相位钟
let lastActive = 0;                     // 上次交互的 simTime

// URL 预置：?state=ice|water|steam  ?ui=0  ?debug
{
  const s = params.get('state');
  if (s === 'ice') targetTemp = dispTemp = -36;
  else if (s === 'steam') targetTemp = dispTemp = 130;
  else if (s === 'water') targetTemp = dispTemp = 24;
  else if (params.has('temp')) {
    const custom = Number(params.get('temp'));
    if (Number.isFinite(custom)) targetTemp = dispTemp = clamp(custom,-36,150);
  }
  slider.value = String(targetTemp);
  targetReading.textContent = Math.round(targetTemp) + '°C';
  markPresets([-36,24,130].includes(targetTemp) ? targetTemp : NaN);
  if (params.get('ui') === '0') {
    ['panel', 'title', 'hint'].forEach(id => $('#' + id).classList.add('ui-off'));
    $('#panel').inert = true;
  }
}

// 涟漪槽
const NR = 24;
const ripples = new Float32Array(NR * 4).fill(0);
for (let i = 0; i < NR; i++) ripples[i * 4 + 2] = -100;
let rippleHead = 0;
function addRipple(x, z, k) {
  const i = rippleHead; rippleHead = (rippleHead + 1) % NR;
  ripples[i * 4] = x; ripples[i * 4 + 1] = z;
  ripples[i * 4 + 2] = simTime; ripples[i * 4 + 3] = k || (0.32 + Math.random() * 0.1);
}

// 每帧导出的状态参数
let P = {};
function updateStateParams() {
  const t = dispTemp;
  const ice = ssj(1.5, -4, t);
  const deepIce = ssj(-10, -34, t);
  const steam = ssj(72, 108, t) * (1 - ice);
  const warm = ssj(35, 95, t) * (1 - steam);
  const snow = ssj(-3, -13, t);
  const mix3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  let deep = mix3([0.010, 0.085, 0.110], [0.025, 0.150, 0.160], clamp(warm * 0.8 + steam * 0.4, 0, 1));
  deep = mix3(deep, [0.040, 0.190, 0.220], ice);
  let waterCol = mix3([0.040, 0.300, 0.330], [0.070, 0.360, 0.330], warm);
  P = { ice, deepIce, steam, warm, snow, waveAmp: Math.max(0, 1 - 0.96 * ice - 0.025 * deepIce) * (1 - 0.16 * steam), deep, waterCol };
}

/* ================= 输入 ================= */
let dragging = false, moved = 0, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  yawV = 0; pitchV = 0;                 // 按住即接管，清掉惯性
  lastActive = simTime;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6) {
    lastActive = simTime;
    yaw = clamp(yaw - dx * 0.0032, -1.25, 1.25);
    pitch = clamp(pitch - dy * 0.0032, -1.15, -0.15);
    // 记录瞬时角速度（指数平滑），松手后作为惯性初速度
    const k = 0.55;
    yawV = yawV * (1 - k) + (-dx * 0.0032 * 60) * k;
    pitchV = pitchV * (1 - k) + (-dy * 0.0032 * 60) * k;
  }
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  if (moved <= 6 && P.ice < 0.6) {
    lastActive = simTime;
    const B = camBasis(yaw, pitch);
    const ndcX = (e.clientX / canvas.clientWidth) * 2 - 1;
    const ndcY = 1 - (e.clientY / canvas.clientHeight) * 2;
    const tf = Math.tan(FOV / 2), asp = canvas.clientWidth / canvas.clientHeight;
    const dir = v3norm([
      B.f[0] + B.r[0] * ndcX * tf * asp + B.u[0] * ndcY * tf,
      B.f[1] + B.r[1] * ndcX * tf * asp + B.u[1] * ndcY * tf,
      B.f[2] + B.r[2] * ndcX * tf * asp + B.u[2] * ndcY * tf]);
    if (dir[1] < -0.02) {
      const t = -camPos[1] / dir[1];
      const px = camPos[0] + dir[0] * t, pz = camPos[2] + dir[2] * t;
      if (Math.abs(px) < 13 && Math.abs(pz) < 13) {
        addRipple(px, pz, 0.5 + Math.random() * 0.12);   // 加强涟漪
        // —— 打击感：轻微色差 + 震动 ——
        aberr = Math.max(aberr, reducedMotion.matches ? 0 : 0.005);
        shake = Math.max(shake, reducedMotion.matches ? 0 : 0.0015);
        shakeAng = Math.random() * Math.PI * 2; shakeFreq = 26;
      }
    }
  }
});
canvas.addEventListener('pointercancel', () => dragging = false);
// 滚轮缩放（0 近 → 1 远）
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  lastActive = simTime;
  zoomV += (e.deltaY > 0 ? 1 : -1) * 0.38 * Math.min(Math.abs(e.deltaY), 120) / 60;
  zoomV = clamp(zoomV, -1.4, 1.4);
}, { passive: false });

slider.addEventListener('input', () => setTemp(+slider.value, false));
presetBtns.forEach(b => b.addEventListener('click', () => setTemp(+b.dataset.t, true)));
function setTemp(t, fromPreset) {
  targetTemp = t;
  lastActive = simTime;
  targetReading.textContent = Math.round(t) + '°C';
  // 预设分享相态，自由温度写入 temp，刷新或分享链接均能复现。
  const st = { '-36': 'ice', '24': 'water', '130': 'steam' }[String(t)];
  const url = new URL(location.href);
  if (st) { url.searchParams.set('state', st); url.searchParams.delete('temp'); }
  else { url.searchParams.delete('state'); url.searchParams.set('temp', String(t)); }
  history.replaceState(null, '', url);
  if (fromPreset) {
    slider.value = t;
    markPresets(t);
    presetBtns.forEach(b => { if (+b.dataset.t === t) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } });
  } else {
    markPresets(NaN);   // 自由温度：不高亮任何预设（updateUI 会按最近预设回标）
  }
}
window.addEventListener('keydown', e => {
  if (e.key === '1') setTemp(-36, true);
  if (e.key === '2') setTemp(24, true);
  if (e.key === '3') setTemp(130, true);

    const hidden = !$('#panel').classList.contains('ui-off');
    ['panel', 'title', 'hint'].forEach(id => $('#' + id).classList.toggle('ui-off', hidden));
    $('#panel').inert = hidden; // 已隐藏的控件也退出键盘 Tab 顺序
    const url = new URL(location.href);

});

let lastBadge = '', lastPhase = '', lastNear = null;
function updateUI() {
  const t = dispTemp, p = P;
  let name, color;
  if (p.ice > 0.85) { name = '凝固态 · 冰'; color = '#9adcff'; }
  else if (p.ice > 0.05) { name = '正在结冰…'; color = '#bfe8ff'; }
  else if (p.steam > 0.85) { name = '蒸发态 · 汽'; color = '#ffb36b'; }
  else if (p.steam > 0.05) { name = '正在沸腾…'; color = '#ffd39b'; }
  else { name = '液态 · 水'; color = '#5fe8cf'; }
  const deg = Math.round(t) + '°C';
  if (deg + name !== lastBadge) {
    badgeT.textContent = deg;
    badgeS.textContent = name;
    badge.style.setProperty('--state', color);
    lastBadge = deg + name;
  }
  // 仅在相态名称变化时弹跳徽章，拖动滑杆不再每帧 pop
  if (name !== lastPhase) {
    lastPhase = name;
    badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
  }
  const exactPreset = [-36,24,130].includes(targetTemp) ? targetTemp : 'custom';
  if (exactPreset !== lastNear) { lastNear = exactPreset; markPresets(exactPreset); }
}

/* ================= 渲染 ================= */
function setCommon(p, B, VP) {
  gl.uniformMatrix4fv(U(p, 'uVP'), false, VP);
  gl.uniform3f(U(p, 'uCam'), camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(U(p, 'uSun'), SUN[0], SUN[1], SUN[2]);
  gl.uniform1f(U(p, 'uTime'), simTime);
  return p;
}

let ema = 16, qTimer = 0;
function updateQuality(dt) {
  qTimer += dt;
  if (qTimer > 1.6) {
    qTimer = 0;
    const steps = [1.0, 0.85, 0.7, 0.55];
    let i = steps.indexOf(resAdj);
    if (ema > 26 && i < steps.length - 1) { resAdj = steps[i + 1]; resize(); }
    else if (ema < 15 && i > 0) { resAdj = steps[i - 1]; resize(); }
  }
}

function render() {
  resize();
  // 速度耦合倾斜：俯仰随角速度轻微前倾/后仰，横滚随偏航速度侧倾（松手滑行时最明显）
  const leanP = dragging ? 0 : clamp(-pitchV * 0.030, -0.055, 0.055);
  const roll = clamp(yawV * 0.045, -0.05, 0.05);
  const B = rollBasis(camBasis(yaw, pitch + leanP), roll);
  const asp = canvas.width / canvas.height;
  const view = m4View(camPos, B);
  const proj = m4Persp(FOV, asp, 0.1, 120);
  const VP = m4Mul(proj, view);

  // 太阳屏幕位置
  let sunUV = [0.5, 0.5], sunVis = 0;
  {
    const px = camPos[0] + SUN[0] * 800, py = camPos[1] + SUN[1] * 800, pz = camPos[2] + SUN[2] * 800;
    const cx = VP[0] * px + VP[4] * py + VP[8] * pz + VP[12];
    const cy = VP[1] * px + VP[5] * py + VP[9] * pz + VP[13];
    const cw = VP[3] * px + VP[7] * py + VP[11] * pz + VP[15];
    if (cw > 0.01) {
      const nx = cx / cw, ny = cy / cw;
      if (Math.abs(nx) < 1.7 && Math.abs(ny) < 1.7) { sunVis = 1; sunUV = [nx * 0.5 + 0.5, ny * 0.5 + 0.5]; }
    }
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb);
  gl.viewport(0, 0, fboW, fboH);
  gl.disable(gl.BLEND);
  gl.clearColor(P.deep[0], P.deep[1], P.deep[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 天空
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progSky);
  gl.bindVertexArray(triVAO);
  gl.uniform3f(U(progSky, 'uCamR'), B.r[0], B.r[1], B.r[2]);
  gl.uniform3f(U(progSky, 'uCamU'), B.u[0], B.u[1], B.u[2]);
  gl.uniform3f(U(progSky, 'uCamF'), B.f[0], B.f[1], B.f[2]);
  gl.uniform1f(U(progSky, 'uTanF'), Math.tan(FOV / 2));
  gl.uniform1f(U(progSky, 'uAspect'), asp);
  gl.uniform3f(U(progSky, 'uSun'), SUN[0], SUN[1], SUN[2]);
  gl.uniform3f(U(progSky, 'uCam'), camPos[0], camPos[1], camPos[2]);
  gl.uniform1f(U(progSky, 'uTime'), simTime);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 海床
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(progSeabed);
  gl.bindVertexArray(seabedVAO);
  setCommon(progSeabed, B, VP);
  gl.uniform3f(U(progSeabed, 'uDeep'), P.deep[0], P.deep[1], P.deep[2]);
  gl.uniform1f(U(progSeabed, 'uIce'), P.ice);
  gl.uniform1f(U(progSeabed, 'uDeepIce'), P.deepIce);
  gl.uniform1f(U(progSeabed, 'uSteam'), P.steam);
  gl.uniform1f(U(progSeabed, 'uWarm'), P.warm);
  gl.drawElements(gl.TRIANGLES, seabedVAO.count, gl.UNSIGNED_SHORT, 0);

  // 水面（预乘 alpha 混合）
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progWater);
  gl.bindVertexArray(waterVAO);
  setCommon(progWater, B, VP);
  gl.uniform1f(U(progWater, 'uWaveAmp'), P.waveAmp * (1 + 0.07 * idleAmt * Math.sin(idleClock * 0.4)));
  gl.uniform1f(U(progWater, 'uSteam'), P.steam);
  gl.uniform1f(U(progWater, 'uIce'), P.ice);
  gl.uniform1f(U(progWater, 'uDeepIce'), P.deepIce);
  gl.uniform1f(U(progWater, 'uWarm'), P.warm);
  gl.uniform3f(U(progWater, 'uWaterCol'), P.waterCol[0], P.waterCol[1], P.waterCol[2]);
  gl.uniform3f(U(progWater, 'uDeep'), P.deep[0], P.deep[1], P.deep[2]);
  gl.uniform4fv(U(progWater, 'uRipple'), ripples);
  gl.drawElements(gl.TRIANGLES, waterVAO.count, gl.UNSIGNED_INT, 0);

  // 蒸汽
  if (P.steam > 0.003) {
    gl.depthMask(false);
    gl.useProgram(progSteam);
    gl.bindVertexArray(steamVAO);
    gl.uniformMatrix4fv(U(progSteam, 'uVP'), false, VP);
    gl.uniform3f(U(progSteam, 'uCamR'), B.r[0], B.r[1], B.r[2]);
    gl.uniform3f(U(progSteam, 'uCamU'), B.u[0], B.u[1], B.u[2]);
    gl.uniform1f(U(progSteam, 'uTime'), simTime);
    gl.uniform1f(U(progSteam, 'uSteam'), P.steam);
    gl.drawElements(gl.TRIANGLES, steamVAO.count, gl.UNSIGNED_SHORT, 0);
    gl.depthMask(true);
  }
  // 雪
  if (P.snow > 0.003) {
    gl.depthMask(false);
    gl.useProgram(progSnow);
    gl.bindVertexArray(snowVAO);
    gl.uniformMatrix4fv(U(progSnow, 'uVP'), false, VP);
    gl.uniform1f(U(progSnow, 'uTime'), simTime);
    gl.uniform1f(U(progSnow, 'uSnow'), P.snow);
    gl.uniform1f(U(progSnow, 'uDPR'), dpr);
    gl.drawArrays(gl.POINTS, 0, 160);
    gl.depthMask(true);
  }
  gl.disable(gl.BLEND);

  // 后处理
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progPost);
  gl.bindVertexArray(triVAO);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(U(progPost, 'uTex'), 0);
  gl.uniform1f(U(progPost, 'uTime'), simTime);
  gl.uniform1f(U(progPost, 'uSteam'), P.steam);
  gl.uniform2f(U(progPost, 'uSunUV'), sunUV[0], sunUV[1]);
  gl.uniform1f(U(progPost, 'uSunVis'), sunVis);
  gl.uniform1f(U(progPost, 'uHdr'), useHDR ? 1 : 0);
  gl.uniform1f(U(progPost, 'uFlash'), flash);
  gl.uniform1f(U(progPost, 'uAberr'), aberr);
  gl.uniform1f(U(progPost, 'uShake'), shake * Math.sin(shakeAng));
  gl.uniform1f(U(progPost, 'uIdle'), idleAmt);
  gl.uniform2f(U(progPost, 'uShakeDir'), Math.cos(shakeAng * 0.7), Math.sin(shakeAng * 0.7));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

/* ================= 主循环 ================= */
updateStateParams();
resize();
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  ema = ema * 0.94 + (dt * 1000) * 0.06;
  if (DEBUG) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { $('#fps').textContent = Math.round(fpsN / fpsAcc) + ' fps · ' + Math.round(fboW) + 'p'; fpsAcc = 0; fpsN = 0; } }
  simTime += reducedMotion.matches ? 0 : dt;

  // —— 温度缓动 + 变化率 ——
  const prevDisp = dispTemp;
  dispTemp += (targetTemp - dispTemp) * Math.min(1, dt * 1.6);
  if (Math.abs(targetTemp - dispTemp) < 0.05) dispTemp = targetTemp;
  tempVel = (dispTemp - prevDisp) / Math.max(dt, 1e-4);
  updateStateParams();

  // —— 相变跨越检测：闪白 + 震屏（max-not-sum 叠加）——
  const crossedIce = (P.ice > 0.5) !== (icePrev > 0.5);
  const crossedSteam = (P.steam > 0.5) !== (steamPrev > 0.5);
  if (crossedIce || crossedSteam) {
    flash = Math.max(flash, reducedMotion.matches ? 0 : 0.16);
    shake = Math.max(shake, reducedMotion.matches ? 0 : 0.0035);
    shakeAng = Math.random() * Math.PI * 2; shakeFreq = 18 + Math.random() * 8;
    addRipple(camPos[0] * 0.6, camPos[2] * 0.6, 0.55);   // 相变冲击在水面荡一圈
  }
  icePrev = P.ice; steamPrev = P.steam;

  // —— 温度变化率驱动色差脉冲 ——
  const targetAberr = reducedMotion.matches ? 0 : Math.min(Math.abs(tempVel) * 0.0004, 0.0035);
  aberr = Math.max(targetAberr, aberr - aberr * Math.min(1, dt * 2.2));
  flash *= Math.exp(-dt * 3.4);
  shake *= Math.exp(-dt * 3.0);
  shakeAng += dt * shakeFreq;
  if (flash < 5e-4) flash = 0;
  if (shake < 2e-5) shake = 0;

  // —— 相机惯性：欠阻尼弹簧（松手回弹）——
  if (!dragging) {
    const kDamp = 5.6;                              // 阻尼系数：轻微过冲后自然滑停
    yaw += yawV * dt; pitch += pitchV * dt;
    yawV -= yawV * kDamp * dt;
    pitchV -= pitchV * kDamp * dt;
    yaw = clamp(yaw, -1.25, 1.25); pitch = clamp(pitch, -1.15, -0.15);
    if (Math.abs(yawV) < 0.004) yawV = 0;
    if (Math.abs(pitchV) < 0.004) pitchV = 0;
  }

  // —— 滚轮缩放弹簧：1-exp(-k·dt) 帧率无关 ——
  zoom = clamp(zoom + zoomV * dt * 2.4, 0, 1);
  zoomV -= zoomV * Math.min(1, dt * 7.5);
  if (Math.abs(zoomV) < 0.01) zoomV = 0;

  // —— idle 呼吸：静止 3 秒后缓慢升起 ——
  const quiet = simTime - lastActive;
  idleAmt = clamp((quiet - 3) / 5, 0, 1);
  if (idleAmt > 0) idleClock += dt * (1 + idleAmt);
  // 相机轻微漂浮 + 水面波幅微呼吸（乘进 uWaveAmp，见 render）
  const drift = idleAmt * 0.5;
  camPos[0] = CAM_POS[0] + Math.sin(idleClock * 0.21) * drift * 0.30;
  camPos[1] = CAM_POS[1] + Math.sin(idleClock * 0.17 + 1.3) * drift * 0.14;
  camPos[2] = CAM_POS[2] * (1 + zoom * 0.9) + Math.cos(idleClock * 0.13) * drift * 0.30;

  if (!document.hidden) {
    updateQuality(dt);
    if (!window.__suspendRendering) render();
    updateUI();
  }
  window.__frames++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
