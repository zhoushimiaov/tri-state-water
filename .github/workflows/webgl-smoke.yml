name: WebGL browser smoke
on:
  pull_request:
  workflow_dispatch:

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate HTML script syntax
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('index.html','utf8');const m=x.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('Missing inline script');new Function(m[1]);"
      - name: Run WebGL smoke and capture states
        run: |
          python3 -m http.server 4173 > server.log 2>&1 &
          node tests/visual-smoke.mjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-webgl-smoke
          path: |
            screenshots/
            server.log
