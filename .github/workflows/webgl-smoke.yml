name: WebGL browser smoke
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check analytical wave normals against finite differences
        run: node tests/wave-derivative-check.mjs
      - name: Validate HTML script syntax
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('index.html','utf8');const a=x.indexOf('<script>'),b=x.lastIndexOf('</script>');if(a<0||b<=a)throw Error('missing inline script');new Function(x.slice(a+8,b));"
      - name: Run WebGL smoke and capture states
        run: |
          python3 -m http.server 4173 > server.log 2>&1 &
          node tests/visual-smoke.mjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-webgl-smoke
          path: |
            screenshots/
            server.log
